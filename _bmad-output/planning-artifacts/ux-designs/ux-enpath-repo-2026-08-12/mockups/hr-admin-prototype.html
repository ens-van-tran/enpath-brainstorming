        <div class="card"><table><caption>Generated cycles retain their framework and formula snapshots.</caption><thead><tr><th>Cycle</th><th>Team</th><th>Participants</th><th>Employee</th><th>Manager</th><th>Status</th><th></th></tr></thead><tbody>${state.cycles.map(c=>`<tr><td><div class="row-title">${esc(c.name)}</div><div class="row-meta">${esc(c.id)} · ${esc(c.framework)}</div></td><td>${esc(c.team)}</td><td>${c.participants}</td><td><div class="progress"><span style="width:${c.participants?c.employeeComplete/c.participants*100:0}%"></span></div><div class="row-meta">${c.employeeComplete}/${c.participants}</div></td><td><div class="progress"><span style="width:${c.participants?c.managerComplete/c.participants*100:0}%"></span></div><div class="row-meta">${c.managerComplete}/${c.participants}</div></td><td>${badge(c.status)}</td><td>${c.status!=='Complete'?`<button class="button small" data-progress-cycle="${c.id}">Simulate completion</button>`:''}</td></tr>`).join('')}</tbody></table></div>`;
    }

    function renderGenerateAssessment(){
      const team=state.teams.find(t=>t.id===state.generation.teamId)||state.teams[0]; const selected=state.generation.selected.filter(id=>team.members.some(m=>m.id===id)); state.generation.selected=selected; const validSelected=team.members.filter(member=>selected.includes(member.id)&&member.eligible&&team.matrix); const blockedSelected=team.members.filter(member=>selected.includes(member.id)&&(!member.eligible||!team.matrix)); const ready=validSelected.length>0&&blockedSelected.length===0;
      document.getElementById('generate-assessment').innerHTML=pageHeader('Assessment · New cycle','Generate Assessment','Choose scope, verify eligibility and preview mixed assessment modes before generation.',`<button class="button primary" id="generate-cycle" ${ready?'':'disabled'}>Generate ${validSelected.length} assessments</button>`,`<span class="chip">Framework v2.0 snapshot</span><span class="chip">Employee ${state.sourceWeights.employee}% · Manager ${state.sourceWeights.manager}%</span>`)+`
        <div class="grid two"><div class="stack"><div class="card"><div class="section-head"><div><h2>1. Cycle scope</h2><p>Eligible members are selected by default.</p></div><span class="badge ${team.matrix?'success':'danger'}">${team.matrix?'Published matrix':'No published matrix'}</span></div><div class="field-row"><div class="field"><label>Cycle name</label><input id="generation-name" value="${esc(state.generation.name)}"></div><div class="field"><label>Team</label><select id="generation-team">${state.teams.map(t=>`<option value="${t.id}" ${t.id===team.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div></div></div><div class="card"><div class="section-head"><div><h2>2. Participants</h2><p>${validSelected.length} ready · ${blockedSelected.length} blocked · ${team.members.length} total</p></div><button class="button small" id="select-eligible">Select eligible</button></div>${team.members.map(member=>`<div class="participant ${(!member.eligible||!team.matrix)?'blocked':''}"><label><input type="checkbox" data-participant="${member.id}" ${selected.includes(member.id)?'checked':''}> <span><b>${esc(member.name)}</b><span class="row-meta">${esc(member.role)} · ${esc(member.level)}</span></span></label>${member.eligible&&team.matrix?'<span class="badge success">Ready</span>':'<span class="badge danger">No published role/level matrix</span>'}</div>`).join('')}</div>${blockedSelected.length?'<div class="validation"><b>Generation is blocked</b><p>Exclude members without a published Role + Level matrix or return to framework governance.</p></div>':''}</div>
        <div class="stack"><div class="card accent"><div class="section-head"><div><h2>3. Assessment preview</h2><p>Employee and Manager receive independent copies.</p></div><span class="badge info">Mixed mode</span></div><div class="assessment-preview"><div class="assessment-item"><header><div><h3>Communication</h3><p class="muted fine">Behavior / Level · Global</p></div><span class="badge neutral">5 levels</span></header><label class="preview-choice"><input type="radio" disabled> 3 · Proficient — adapts context and communicates decisions.</label></div><div class="assessment-item"><header><div><h3>Technical Delivery</h3><p class="muted fine">Criteria / Point · Platform Team</p></div><span class="badge neutral">3 criteria</span></header><div class="summary-list"><span>Delivers committed scope</span><b>40%</b></div><div class="summary-list"><span>Raises blockers early</span><b>30%</b></div><div class="summary-list"><span>Estimates accurately</span><b>30%</b></div></div></div></div><div class="card"><h2>Generation summary</h2><div class="divider"></div><div class="summary-list"><span>Selected and eligible</span><b>${validSelected.length}</b></div><div class="summary-list"><span>Rating sources per member</span><b>2</b></div><div class="summary-list"><span>Framework snapshot</span><b>v2.0</b></div><div class="summary-list"><span>Formula snapshot</span><b>FR-2</b></div></div></div></div>`;
    }

    function barsHtml(items){ return `<div class="bars">${items.map(item=>{const gap=item.stats?.gap??teamStats(item,true).gap; const actualValue=gap==null?null:clamp((4-gap)/4*100,0,100);return `<button class="bar-button" data-team-drill="${item.id}" aria-label="Open ${esc(item.name)}, Average Gap ${format(gap)}"><div class="bar-track">${actualValue==null?'':`<div class="bar-fill" style="height:${actualValue}%"></div>`}</div><b>${esc(item.short||item.name)}</b><small>Gap ${format(gap)}</small></button>`}).join('')}</div><div class="legend"><span><i class="swatch" style="background:var(--actual)"></i>Actual fill</span><span><i class="swatch" style="border:2px solid var(--border-strong)"></i>Expected outline</span></div>`; }
    function renderCompanyGaps(){
      const ranked=state.teams.filter(team=>team.matrix).map(team=>({...team,stats:teamStats(team,true)})).sort((a,b)=>(b.stats.gap||0)-(a.stats.gap||0)); document.getElementById('company-gaps').innerHTML=pageHeader('Analytics · Company','Company Gaps','Compare shared Global Competencies across teams; role-specific competencies stay within team analysis.',`<button class="button" data-nav="team-gaps">Open team analysis</button>`,`<span class="chip">Framework v2.0</span><span class="chip">Global competencies only</span>`)+`
        <div class="grid two"><div class="card"><div class="section-head"><div><h2>Average Gap by team</h2><p>Expected minus weighted Actual; Unknown excluded.</p></div></div>${barsHtml(ranked)}</div><div class="card"><h2>Ranked numeric view</h2><table style="margin-top:12px"><thead><tr><th>Team</th><th class="numeric">Gap</th><th class="numeric">Coverage</th><th></th></tr></thead><tbody>${ranked.map((team,i)=>`<tr><td><span class="rule">${String(i+1).padStart(2,'0')}</span> · <b>${esc(team.name)}</b></td><td class="numeric">${format(team.stats.gap)}</td><td class="numeric">${team.stats.coverage.toFixed(0)}%</td><td><button class="button small" data-team-drill="${team.id}">Inspect</button></td></tr>`).join('')}</tbody></table><div class="advice" style="margin-top:14px"><b>${esc(ranked[0].name)} has the widest confirmed shared gap.</b><br>Inspect the team to find the members and competencies contributing to it.</div></div></div>`;
    }

    function renderTeamGaps(){
      const team=state.teams.find(t=>t.id===currentTeamId&&t.matrix)||state.teams.find(t=>t.matrix); currentTeamId=team.id; const ranked=team.members.map(member=>({...member,stats:memberStats(member)})).sort((a,b)=>(b.stats.gap??-1)-(a.stats.gap??-1)); const member=ranked.find(m=>m.id===currentMemberId)||ranked[0]; currentMemberId=member.id; const rows=Object.entries(member.scores).map(([id,score])=>({competency:state.competencies.find(c=>c.id===id),score,actual:actual(score),gap:scoreGap(score)})); const known=rows.filter(r=>r.actual!=null); const strengths=known.filter(r=>r.gap<=0).length, weaknesses=known.filter(r=>r.gap>0).length; const highest=[...known].sort((a,b)=>b.gap-a.gap)[0];
      document.getElementById('team-gaps').innerHTML=pageHeader('Analytics · Team and member','Team Gaps','Rank members by confirmed Average Gap and inspect strengths, weaknesses and configured advice.',`<select class="input" id="analytics-team" style="width:220px">${state.teams.filter(t=>t.matrix).map(t=>`<option value="${t.id}" ${t.id===team.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`,`<span class="chip">${esc(team.name)}</span><span class="chip">Unknown excluded</span>`)+`
        <div class="grid equal"><div class="card"><div class="section-head"><div><h2>Member ranking</h2><p>Average across confirmed competency gaps.</p></div><span class="badge warn">${teamStats(team).coverage.toFixed(0)}% coverage</span></div>${ranked.map((m,i)=>`<div class="rank-row ${m.id===member.id?'selected':''}"><span class="rule">${String(i+1).padStart(2,'0')}</span><div><b>${esc(m.name)}</b><div class="row-meta">${esc(m.role)} · ${esc(m.level)} · ${m.stats.known}/${m.stats.total} assessed</div></div><b class="numeric">${format(m.stats.gap)}</b><button class="button small" data-member="${m.id}">Inspect</button></div>`).join('')}</div>
        <div class="stack"><div class="card accent"><div class="section-head"><div><h2>${esc(member.name)}</h2><p>${esc(member.role)} · ${esc(member.level)} · Employee ${state.sourceWeights.employee}% / Manager ${state.sourceWeights.manager}%</p></div><span class="badge info">Gap ${format(member.stats.gap)}</span></div><div class="grid stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><span>Strengths</span><strong>${strengths}</strong><small>Meets or exceeds expected</small></div><div class="stat"><span>Weaknesses</span><strong>${weaknesses}</strong><small>Positive confirmed gap</small></div><div class="stat"><span>Coverage</span><strong>${member.stats.total?Math.round(member.stats.known/member.stats.total*100):0}%</strong><small>Unknown excluded</small></div></div>${rows.map(row=>scoreRow(row)).join('')}</div>${highest?`<div class="advice"><b>Improve ${esc(highest.competency?.name||'this skill')} first · Gap ${format(highest.gap)}</b><br>${esc(highest.competency?.advice||'No advice is configured.')}<div class="fine" style="margin-top:6px">Configured by ${esc(highest.competency?.owner||'Unknown')} · ${esc(highest.competency?.scope||'Unknown')} competency</div></div>`:'<div class="unknown">No confirmed result is available for advice.</div>'}<div class="card"><h2>Numeric equivalent</h2><table style="margin-top:12px"><thead><tr><th>Competency</th><th class="numeric">Self</th><th class="numeric">Manager</th><th class="numeric">Actual</th><th class="numeric">Expected</th><th class="numeric">Gap</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.competency?.name||'Unknown')}</td><td class="numeric">${format(r.score.self)}</td><td class="numeric">${format(r.score.manager)}</td><td class="numeric">${format(r.actual)}</td><td class="numeric">${format(r.score.expected)}</td><td class="numeric">${format(r.gap)}</td></tr>`).join('')}</tbody></table></div></div></div>`;
    }
    function scoreRow(row){ const max=state.levelCount,fill=row.actual==null?0:clamp(row.actual/max*100,0,100),expected=clamp(row.score.expected/max*100,0,100); return `<div class="score-row"><div><b>${esc(row.competency?.name||'Unknown')}</b><div class="row-meta">${esc(row.competency?.scope||'')}</div></div>${row.actual==null?'<div class="unknown">Unknown</div>':`<div class="score-track" aria-label="Actual ${format(row.actual)}, Expected ${format(row.score.expected)}"><div class="score-fill" style="width:${fill}%"></div><div class="score-marker" style="left:${expected}%"></div></div>`}<span class="numeric">${format(row.score.self)}</span><span class="numeric">${format(row.score.manager)}</span><b class="numeric">${format(row.actual)}</b><b class="numeric">${format(row.gap)}</b></div>`; }

    function renderVersionHistory(){
      document.getElementById('version-history').innerHTML=pageHeader('Governance · Immutable history','Version History','Inspect scheduled, active and superseded records without rewriting historical assessments.')+`<div class="card"><div class="timeline">${state.versions.map(v=>`<div class="timeline-item"><div class="section-head"><div><h3>${esc(v.name)}</h3><p>${esc(v.id)} · Effective ${esc(v.effective)} · ${esc(v.owner)}</p></div>${badge(v.status)}</div><p>${esc(v.note)}</p></div>`).join('')}</div></div>`;
    }
    function renderAuditLog(){
      document.getElementById('audit-log').innerHTML=pageHeader('Governance · Accountable changes','Audit Log','Trace who changed what, when, and why during this prototype session.',`<button class="button" id="export-audit">Export visible log</button>`)+`<div class="card"><div class="toolbar"><div class="field"><label>Search audit entries</label><input id="audit-search" placeholder="Actor, action or object"></div><span class="chip">${state.audit.length} events</span></div><div id="audit-entries">${auditRows('')}</div></div>`;
    }
    function auditRows(query){ const q=query.toLowerCase(); const rows=state.audit.filter(e=>Object.values(e).some(v=>String(v).toLowerCase().includes(q))); return rows.length?rows.map(e=>`<div class="audit-entry"><span class="fine muted">${esc(e.time)}</span><b>${esc(e.actor)}</b><span>${esc(e.action)}</span><span class="rule">${esc(e.object)}</span></div>`).join(''):'<div class="empty">No matching audit events.</div>'; }

    const renderers={'overview':renderOverview,'competency-types':renderCompetencyTypes,'competencies':renderCompetencies,'level-model':renderLevelModel,'formula-rules':renderFormulaRules,'matrix-reviews':renderMatrixReviews,'assessment-cycles':renderAssessmentCycles,'generate-assessment':renderGenerateAssessment,'company-gaps':renderCompanyGaps,'team-gaps':renderTeamGaps,'version-history':renderVersionHistory,'audit-log':renderAuditLog};

    function bindDynamic(){
      document.querySelectorAll('[data-review]').forEach(el=>el.onclick=()=>{selectedReviewId=el.dataset.review;navigate('matrix-reviews')});
      document.querySelectorAll('[data-select-review]').forEach(el=>el.onclick=()=>{selectedReviewId=el.dataset.selectReview;render()});
      document.querySelectorAll('[data-team-drill]').forEach(el=>el.onclick=()=>{currentTeamId=el.dataset.teamDrill;navigate('team-gaps')});
      document.querySelectorAll('[data-member]').forEach(el=>el.onclick=()=>{currentMemberId=el.dataset.member;render()});
      document.querySelectorAll('[data-edit-type]').forEach(el=>el.onclick=()=>editType(el.dataset.editType));
      document.querySelectorAll('[data-remove-assignment]').forEach(el=>el.onclick=()=>removeAssignment(el.dataset.removeAssignment));
      document.querySelectorAll('[data-level-count]').forEach(el=>el.onclick=()=>{state.levelCount=Number(el.dataset.levelCount);save();render()});
      document.querySelectorAll('[data-level-name]').forEach(el=>el.oninput=()=>{state.levels[Number(el.dataset.levelName)].name=el.value;save()});
      document.querySelectorAll('[data-level-description]').forEach(el=>el.oninput=()=>{state.levels[Number(el.dataset.levelDescription)].description=el.value;save()});
      document.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>{activeCompetency().mode=el.dataset.mode;save();render()});
      document.querySelectorAll('[data-behavior]').forEach(el=>el.onchange=()=>{activeCompetency().behaviors[Number(el.dataset.behavior)]=el.value;save();render()});
      document.querySelectorAll('[data-criterion-name]').forEach(el=>el.onchange=()=>{activeCompetency().criteria[Number(el.dataset.criterionName)].name=el.value;save();render()});
      document.querySelectorAll('[data-criterion-weight]').forEach(el=>el.onchange=()=>{activeCompetency().criteria[Number(el.dataset.criterionWeight)].weight=clamp(el.value,0,100);save();render()});
      document.querySelectorAll('[data-criterion-expected]').forEach(el=>el.onchange=()=>{activeCompetency().criteria[Number(el.dataset.criterionExpected)].expected=Number(el.value);save();render()});
      document.querySelectorAll('[data-remove-criterion]').forEach(el=>el.onclick=()=>{activeCompetency().criteria.splice(Number(el.dataset.removeCriterion),1);save();render()});
      document.querySelectorAll('[data-participant]').forEach(el=>el.onchange=()=>{const ids=new Set(state.generation.selected);el.checked?ids.add(el.dataset.participant):ids.delete(el.dataset.participant);state.generation.selected=[...ids];save();render()});
      document.querySelectorAll('[data-progress-cycle]').forEach(el=>el.onclick=()=>progressCycle(el.dataset.progressCycle));
      const byId=id=>document.getElementById(id);
      if(byId('add-type'))byId('add-type').onclick=()=>editType();
      if(byId('add-assignment'))byId('add-assignment').onclick=addAssignment;
      if(byId('competency-select'))byId('competency-select').onchange=e=>{state.activeCompetencyId=e.target.value;save();render()};
      if(byId('new-competency'))byId('new-competency').onclick=newCompetency;
      if(byId('comp-name'))byId('comp-name').onchange=e=>{activeCompetency().name=e.target.value;save();render()};
      if(byId('comp-type'))byId('comp-type').onchange=e=>{activeCompetency().typeId=e.target.value;save();render()};
      if(byId('comp-scope'))byId('comp-scope').onchange=e=>{activeCompetency().scope=e.target.value;save();render()};
      if(byId('comp-description'))byId('comp-description').onchange=e=>{activeCompetency().description=e.target.value;save();render()};
      if(byId('comp-advice'))byId('comp-advice').onchange=e=>{activeCompetency().advice=e.target.value;save();render()};
      if(byId('add-criterion'))byId('add-criterion').onclick=()=>{activeCompetency().criteria.push({id:uid('cr'),name:'New criterion',weight:0,expected:3});save();render()};
      if(byId('save-competency'))byId('save-competency').onclick=()=>{activeCompetency().status='Draft';log('Saved competency draft',activeCompetency().name);toast('Draft saved locally.');render()};
      if(byId('submit-competency'))byId('submit-competency').onclick=()=>{activeCompetency().status='Published';log('Submitted competency version',activeCompetency().name);toast('Competency version submitted for governance.');render()};
      if(byId('save-level-model'))byId('save-level-model').onclick=saveLevelModel;
      if(byId('employee-weight'))byId('employee-weight').onchange=e=>{state.sourceWeights.employee=clamp(e.target.value,0,100);save();render()};
      if(byId('manager-weight'))byId('manager-weight').onchange=e=>{state.sourceWeights.manager=clamp(e.target.value,0,100);save();render()};
      if(byId('save-formula'))byId('save-formula').onclick=()=>{state.versions.unshift({id:`FR-${state.versions.filter(v=>v.id.startsWith('FR-')).length+3}`,name:'Formula Rules',status:'Active',effective:todayStamp(),owner:'Mai Thy',note:`Employee ${state.sourceWeights.employee}% / Manager ${state.sourceWeights.manager}%.`});log('Published formula rule version','Formula Rules');toast('Formula rule version saved.');render()};
      if(byId('request-changes'))byId('request-changes').onclick=requestChanges;
      if(byId('publish-review'))byId('publish-review').onclick=publishReview;
      if(byId('generation-name'))byId('generation-name').oninput=e=>{state.generation.name=e.target.value;save()};
      if(byId('generation-team'))byId('generation-team').onchange=e=>{state.generation.teamId=e.target.value;const team=state.teams.find(t=>t.id===e.target.value);state.generation.selected=team.members.filter(m=>m.eligible&&team.matrix).map(m=>m.id);save();render()};
      if(byId('select-eligible'))byId('select-eligible').onclick=()=>{const team=state.teams.find(t=>t.id===state.generation.teamId);state.generation.selected=team.members.filter(m=>m.eligible&&team.matrix).map(m=>m.id);save();render()};
      if(byId('generate-cycle'))byId('generate-cycle').onclick=generateCycle;
      if(byId('analytics-team'))byId('analytics-team').onchange=e=>{currentTeamId=e.target.value;currentMemberId='';render()};
      if(byId('audit-search'))byId('audit-search').oninput=e=>{byId('audit-entries').innerHTML=auditRows(e.target.value)};
      if(byId('export-audit'))byId('export-audit').onclick=exportAudit;
    }

    function activeCompetency(){ return state.competencies.find(c=>c.id===state.activeCompetencyId)||state.competencies[0]; }
    function editType(id){ const type=state.types.find(t=>t.id===id); openDialog({eyebrow:'Competency taxonomy',title:type?'Edit competency type':'Add competency type',body:`<div class="field"><label>Name</label><input id="type-name" value="${esc(type?.name||'')}"></div><div class="field" style="margin-top:12px"><label>Description</label><textarea id="type-description">${esc(type?.description||'')}</textarea></div>`,confirm:type?'Save changes':'Add type',onConfirm:()=>{const name=document.getElementById('type-name').value.trim(),description=document.getElementById('type-description').value.trim();if(!name){toast('Type name is required.','error');return}if(type){type.name=name;type.description=description;log('Updated competency type',name)}else{state.types.push({id:uid('type'),name,description,status:'Active'});log('Created competency type',name)}closeDialog();toast('Competency type register updated.');render()}}); }
    function addAssignment(){ openDialog({eyebrow:'Delegated authoring',title:'Assign a Competency Type',body:`<div class="field"><label>Competency Type</label><select id="assign-type">${state.types.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="field-row" style="margin-top:12px"><div class="field"><label>Manager</label><input id="assign-manager" value="Trí Nguyễn"></div><div class="field"><label>Team</label><input id="assign-team" value="Platform Team"></div></div><div class="field" style="margin-top:12px"><label>Role scope</label><input id="assign-role" value="Software Engineer"></div>`,confirm:'Assign type',onConfirm:()=>{const assignment={id:uid('as'),typeId:document.getElementById('assign-type').value,manager:document.getElementById('assign-manager').value.trim(),team:document.getElementById('assign-team').value.trim(),role:document.getElementById('assign-role').value.trim()};if(!assignment.manager||!assignment.team||!assignment.role){toast('Manager, team and role are required.','error');return}state.assignments.push(assignment);log('Assigned competency authoring scope',`${typeName(assignment.typeId)} · ${assignment.team}`);closeDialog();toast('Manager assignment added.');render()}}); }
    function removeAssignment(id){ const assignment=state.assignments.find(a=>a.id===id);openDialog({eyebrow:'Governance change',title:'Remove authoring assignment?',body:`<p>This removes <b>${esc(typeName(assignment.typeId))}</b> authoring permission for ${esc(assignment.manager)} in ${esc(assignment.team)}. Existing versions remain in history.</p>`,confirm:'Remove assignment',danger:true,onConfirm:()=>{state.assignments=state.assignments.filter(a=>a.id!==id);log('Removed competency authoring scope',`${typeName(assignment.typeId)} · ${assignment.team}`);closeDialog();toast('Assignment removed.');render()}}); }
    function newCompetency(){ const comp={id:uid('comp'),name:'Untitled competency',typeId:state.types[0].id,scope:'Global',owner:'HR/L&D',mode:'behavior',status:'Draft',description:'',advice:'',behaviors:Array(5).fill(''),criteria:[]};state.competencies.push(comp);state.activeCompetencyId=comp.id;log('Created competency draft',comp.name);render();toast('New competency draft created.'); }
    function saveLevelModel(){ openDialog({eyebrow:'Immutable version',title:'Create a new Level Model version?',body:`<p>The active ${state.levelCount}-level model will become a new version. Existing competencies and assessments keep their original definitions.</p><div class="validation warning"><b>Impact</b><p>${state.competencies.filter(c=>c.mode==='behavior').length} behavior-based competencies may need a new version before future use.</p></div>`,confirm:'Create version',onConfirm:()=>{const id=`LM-${state.versions.filter(v=>v.id.startsWith('LM-')).length+3}`;state.versions.unshift({id,name:`Level Model · ${state.levelCount} levels`,status:'Active',effective:todayStamp(),owner:'Mai Thy',note:'Shared level vocabulary updated without rewriting history.'});log('Published shared Level Model',id);closeDialog();toast(`${id} created. Historical definitions are preserved.`);render()}}); }
    function requestChanges(){ const review=state.reviews.find(r=>r.id===selectedReviewId);openDialog({eyebrow:'Manager-owned content',title:'Request changes',body:`<p>HR will return ${esc(review.team)} ${esc(review.version)} to ${esc(review.owner)} without editing Manager-owned values.</p><div class="field"><label>Required reason</label><textarea id="change-reason" placeholder="Explain the rule, current value and required correction."></textarea></div><label class="check-row" style="margin-top:12px"><input type="checkbox" id="simulate-resubmit" checked> Simulate a corrected Manager resubmission in this prototype</label>`,confirm:'Send request',onConfirm:()=>{const reason=document.getElementById('change-reason').value.trim();if(!reason){toast('A review reason is required.','error');return}review.reason=reason;review.status='Changes requested';log('Requested matrix changes',`${review.team} ${review.version}`);const simulate=document.getElementById('simulate-resubmit').checked;if(simulate){review.weightTotal=100;review.blocking=0;review.status='Ready';log('Resubmitted corrected matrix',`${review.team} ${review.version}`,review.owner)}closeDialog();toast(simulate?'Changes requested; corrected resubmission received.':'Change request sent.');render()}}); }
    function publishReview(){ const review=state.reviews.find(r=>r.id===selectedReviewId); if(review.blocking||review.weightTotal!==100){toast('Blocking validation must be resolved before publication.','error');return}openDialog({eyebrow:'Publish immutable version',title:`Schedule ${review.version}?`,body:`<div class="summary-list"><span>Scope</span><b>${esc(review.team)} · ${esc(review.role)} · ${esc(review.level)}</b></div><div class="summary-list"><span>Effective date</span><b>${esc(review.effective)}</b></div><div class="summary-list"><span>Current version</span><b>${esc(review.activeVersion)}</b></div><p class="fine muted" style="margin-top:12px">The current version stays Active until the effective date. Historical assessments keep their snapshots.</p>`,confirm:'Schedule publication',onConfirm:()=>{review.status='Scheduled';state.versions.unshift({id:`MX-${review.team.split(' ')[0].toUpperCase()}-${review.version}`,name:`${review.team} · ${review.role} · ${review.level}`,status:'Scheduled',effective:review.effective,owner:'Mai Thy',note:`Manager-owned submission by ${review.owner}; validation passed at 100%.`});log('Scheduled matrix publication',`${review.team} ${review.version}`);closeDialog();toast(`${review.version} is scheduled for ${review.effective}.`);render()}}); }
    function generateCycle(){ const team=state.teams.find(t=>t.id===state.generation.teamId),members=team.members.filter(m=>state.generation.selected.includes(m.id)&&m.eligible&&team.matrix);openDialog({eyebrow:'Assessment snapshot',title:'Generate assessment cycle?',body:`<div class="summary-list"><span>Cycle</span><b>${esc(state.generation.name)}</b></div><div class="summary-list"><span>Team</span><b>${esc(team.name)}</b></div><div class="summary-list"><span>Participants</span><b>${members.length}</b></div><div class="summary-list"><span>Rating copies</span><b>${members.length*2}</b></div><div class="validation info" style="margin-top:12px"><b>Snapshot retained</b><p>Framework v2.0 and Employee ${state.sourceWeights.employee}% / Manager ${state.sourceWeights.manager}% are stored with this cycle.</p></div>`,confirm:'Generate cycle',onConfirm:()=>{const id=`PR-2026-${String(state.cycles.length+1).padStart(2,'0')}`;state.cycles.unshift({id,name:state.generation.name,team:team.name,participants:members.length,employeeComplete:0,managerComplete:0,status:'Generated',framework:'v2.0',created:todayStamp()});log('Generated assessment cycle',id);closeDialog();toast(`${id} generated for ${members.length} members.`);navigate('assessment-cycles')}}); }
    function progressCycle(id){ const cycle=state.cycles.find(c=>c.id===id);cycle.employeeComplete=cycle.participants;cycle.managerComplete=cycle.participants;cycle.status='Complete';log('Completed assessment cycle',id,'Demo fixture');toast(`${id} marked complete for analytics.`);render(); }
    function exportAudit(){ const content=['Time,Actor,Action,Object',...state.audit.map(e=>[e.time,e.actor,e.action,e.object].map(v=>`"${String(v).replaceAll('"','""')}"`).join(','))].join('\n');const blob=new Blob([content],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='enpath-audit-log.csv';a.click();URL.revokeObjectURL(url);log('Exported visible audit log','CSV file');toast('Audit log exported as CSV.'); }

    document.addEventListener('click',event=>{const nav=event.target.closest('[data-nav]');if(nav)navigate(nav.dataset.nav);if(event.target.closest('[data-close-dialog]'))closeDialog();if(event.target.closest('[data-close-drawer]'))closeDrawer();});
    document.getElementById('dialog-backdrop').addEventListener('click',event=>{if(event.target.id==='dialog-backdrop')closeDialog()});
    document.getElementById('drawer-backdrop').addEventListener('click',event=>{if(event.target.id==='drawer-backdrop')closeDrawer()});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(document.getElementById('dialog-backdrop').classList.contains('open'))closeDialog();else if(document.getElementById('drawer-backdrop').classList.contains('open'))closeDrawer();}});
    window.addEventListener('hashchange',()=>{route=(location.hash||'#overview').slice(1);render()});
    document.getElementById('reset-demo').onclick=()=>openDialog({eyebrow:'Prototype controls',title:'Reset all demo data?',body:'<p>This clears changes saved by the prototype in this browser and restores the original fixtures.</p>',confirm:'Reset demo data',danger:true,onConfirm:()=>{localStorage.removeItem(STORAGE_KEY);state=deepCopy(initialState);closeDialog();toast('Demo data restored.');navigate('overview')}});
    render();
  </script>
</body>
</html>
