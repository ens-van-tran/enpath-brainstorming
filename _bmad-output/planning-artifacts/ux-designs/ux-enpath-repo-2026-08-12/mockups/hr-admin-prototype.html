    document.addEventListener('click',event=>{const nav=event.target.closest('[data-nav]');if(nav)navigate(nav.dataset.nav);if(event.target.closest('[data-close-dialog]'))closeDialog()});document.getElementById('dialog-backdrop').onclick=e=>{if(e.target.id==='dialog-backdrop')closeDialog()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});window.addEventListener('hashchange',()=>{route=(location.hash||'#overview').slice(1);render()});document.getElementById('reset-demo').onclick=()=>{localStorage.removeItem(STORAGE_KEY);state=deepCopy(initialState);competencyTab='pool';competencySetupTab='definition';toast('Demo data reset.');navigate('overview')};render();
  </script>
