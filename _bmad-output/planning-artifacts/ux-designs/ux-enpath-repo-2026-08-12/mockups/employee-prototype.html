  <script>
    const STORAGE_KEY='enpath-employee-prototype-v2';
    const deepCopy=value=>JSON.parse(JSON.stringify(value));
    const uid=prefix=>`${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,6)}`;
    const todayStamp=()=>new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    const dateStamp=()=>new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
    const esc=value=>String(value??'').replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));
    const clamp=(value,min,max)=>Math.max(min,Math.min(max,Number(value)||0));
    const format=value=>value==null?'Unknown':Number(value).toFixed(1);
    const average=values=>{const known=values.filter(value=>value!=null&&!Number.isNaN(value));return known.length?known.reduce((a,b)=>a+b,0)/known.length:null};
    const initialState={
      levelCount:5,
      levels:[{name:'Below',description:'Frequently misses the expected behavior.'},{name:'Progressing',description:'Shows parts of the expected behavior.'},{name:'Meet',description:'Consistently meets the role-level expectation.'},{name:'Strong',description:'Exceeds the expectation in recurring work.'},{name:'Above',description:'Creates wider impact beyond the role expectation.'}],
      profile:{name:'Employee 101',role:'Software Engineer',level:'L2',team:'Platform Team',framework:'Software Engineer Template',frameworkVersion:'v2.1',manager:'Manager - Platform',targetPathId:'path-se-l3',templateId:'fw-se'},
      competencies:[
        {id:'comp-self',name:'Self-Management',description:'Plans and completes work without creating avoidable delivery risk.',scoreAnchors:['Needs frequent reminders.','Completes routine work with support.','Meets agreed commitments.','Replans early when conditions change.','Creates sustainable working standards.'],advice:['Use a daily checklist.','Plan the week before starting.','Review priorities when scope changes.','Protect focus across competing work.','Coach others on sustainable planning.'],rubric:{role:'Software Engineer',level:'L2',criteria:'Delivery & Execution',below:'Misses deadlines, waits for repeated reminders, or does not track dependencies.',meet:'Completes assigned work on time, tracks progress, and raises delivery risk early.',above:'Prioritizes parallel work independently and keeps delivery quality stable.'}},
        {id:'comp-problem',name:'Problem Solving',description:'Finds practical solutions by structuring problems and testing evidence.',scoreAnchors:['Cannot isolate the problem.','Uses a known fix with guidance.','Breaks down and resolves routine problems.','Coordinates complex resolution.','Creates reusable problem-solving practice.'],advice:['Start with a known troubleshooting path.','Break the issue into smaller causes.','Test alternatives against evidence.','Coordinate owners for complex resolution.','Turn repeated solutions into shared practice.'],rubric:{role:'Software Engineer',level:'L2',criteria:'Problem Resolution',below:'Jumps to a solution without isolating the cause or validating assumptions.',meet:'Breaks the issue down, tests likely causes, and documents the chosen solution.',above:'Finds systemic causes and turns the resolution into reusable team practice.'}},

    function bindDynamic(){

      document.querySelectorAll('[data-explore-path]').forEach(el=>el.onclick=()=>{exploredPathId=el.dataset.explorePath;render()});

      document.querySelectorAll('[data-open-guide]').forEach(el=>el.onclick=()=>{activeGuideId=el.dataset.openGuide;navigate('competency-guide')});
      document.querySelectorAll('[data-evidence-tab]').forEach(el=>el.onclick=()=>{evidenceTab=el.dataset.evidenceTab;render()});

      document.querySelectorAll('[data-submit-evidence]').forEach(el=>el.onclick=()=>setEvidenceStatus(el.dataset.submitEvidence,'Submitted'));
      document.querySelectorAll('[data-withdraw-evidence]').forEach(el=>el.onclick=()=>setEvidenceStatus(el.dataset.withdrawEvidence,'Draft'));
      document.querySelectorAll('[data-delete-evidence]').forEach(el=>el.onclick=()=>deleteEvidence(el.dataset.deleteEvidence));
      document.querySelectorAll('[data-goal-text]').forEach(el=>el.onchange=()=>{const g=state.goals.find(x=>x.id===el.dataset.goalText);g.goal=el.value;save()});

    }
    function setTarget(){const p=path(exploredPathId);openDialog({title:`Set ${p.title} as my target?`,body:`<div class="summary-list"><span>Direction</span><b>${esc(p.direction)}</b></div><div class="summary-list"><span>Competencies compared</span><b>${Object.keys(p.expected).length}</b></div><div class="summary-list"><span>New at this target</span><b>${Object.keys(p.expected).filter(id=>state.scores[id]==null).map(id=>competency(id)?.name).join(', ')||'None'}</b></div><div class="validation info" style="margin-top:12px">One committed target at a time. Gap analytics on Overview and Development Plan compare against it.</div>`,confirm:'Set target',onConfirm:()=>{state.profile.targetPathId=p.id;log('Set career target',p.title);closeDialog();toast('Target updated.');render()}})}
    function submitSelfAssessment(){const list=frameworkCompetencies(),missing=list.filter(c=>!state.cycle.ratings[c.id]?.score);if(missing.length){toast(`Rate every competency before submitting. Missing: ${missing.map(c=>c.name).join(', ')}.`,'error');return}openDialog({title:'Submit self-assessment?',body:`<div class="summary-list"><span>Cycle</span><b>${esc(state.cycle.name)}</b></div><div class="summary-list"><span>Competencies rated</span><b>${list.length}/${list.length}</b></div><div class="validation info" style="margin-top:12px">After submission your ratings and reflections are locked for this cycle and recorded as Employee Score reference data.</div>`,confirm:'Submit',onConfirm:()=>{state.cycle.selfStatus='Submitted';state.cycle.submittedAt=todayStamp();log('Submitted self-assessment',state.cycle.name);closeDialog();toast('Self-assessment submitted.');render()}})}
    function evidenceDrawer(){openDrawer('Add evidence',`<div class="field-row"><div class="field"><label>Title</label><input id="ev-title" placeholder="e.g. Payment retry rollout"></div><div class="field"><label>Type</label><select id="ev-type">${EVIDENCE_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div></div><div class="field-row" style="margin-top:12px"><div class="field"><label>Linked competency</label><select id="ev-comp">${frameworkCompetencies().map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="ev-date" value="${dateStamp()}"></div></div><div class="field" style="margin-top:12px"><label>What this shows</label><textarea id="ev-note" placeholder="Describe the outcome and how it demonstrates the competency."></textarea></div><div class="validation info" style="margin-top:12px">Evidence is saved as Draft. It becomes visible to your Manager only when you submit it.</div>`,'<button class="button" data-close-drawer>Cancel</button><button class="button primary" id="create-evidence">Save as draft</button>');document.getElementById('create-evidence').onclick=()=>{const title=document.getElementById('ev-title').value.trim(),note=document.getElementById('ev-note').value.trim(),date=document.getElementById('ev-date').value.trim();if(!title||!note||!date){toast('Enter a title, date, and description.','error');return}state.evidence.unshift({id:uid('ev'),title,type:document.getElementById('ev-type').value,competencyId:document.getElementById('ev-comp').value,date,status:'Draft',note});log('Added evidence',title);closeDrawer();toast('Evidence saved as draft.');render()}}
    function setEvidenceStatus(id,status){const item=state.evidence.find(e=>e.id===id);item.status=status;log(status==='Submitted'?'Submitted evidence':'Withdrew evidence',item.title);toast(status==='Submitted'?'Evidence submitted.':'Evidence withdrawn to draft.');render()}
    function deleteEvidence(id){const item=state.evidence.find(e=>e.id===id);openDialog({title:'Delete this evidence?',body:`<div class="summary-list"><span>Item</span><b>${esc(item.title)}</b></div><div class="summary-list"><span>Status</span><b>${esc(item.status)}</b></div>`,confirm:'Delete',danger:true,onConfirm:()=>{state.evidence=state.evidence.filter(e=>e.id!==id);log('Deleted evidence',item.title);closeDialog();toast('Evidence deleted.');render()}})}
    function addGoal(competencyId){const options=frameworkCompetencies();openDialog({title:'Add development goal',body:`<div class="field"><label>Competency</label><select id="goal-comp">${options.map(c=>`<option value="${c.id}" ${c.id===competencyId?'selected':''}>${esc(c.name)} · Manager ${format(recorded(c.id))}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Goal</label><textarea id="goal-text" placeholder="What closing this gap looks like in your work."></textarea></div><div class="validation info" style="margin-top:12px">Goals are agreed with ${esc(state.profile.manager)}. Your Manager sees this plan and co-owns the roadmap.</div>`,confirm:'Add goal',onConfirm:()=>{const goal=document.getElementById('goal-text').value.trim(),id=document.getElementById('goal-comp').value;if(!goal){toast('Describe the goal.','error');return}state.goals.push({id:uid('goal'),competencyId:id,goal,actions:[]});log('Created development goal',competency(id)?.name);closeDialog();toast('Goal added.');navigate('development-plan')}})}
    function deleteGoal(id){const g=state.goals.find(x=>x.id===id);openDialog({title:'Remove this goal?',body:`<div class="summary-list"><span>Competency</span><b>${esc(competency(g.competencyId)?.name)}</b></div><div class="summary-list"><span>Action items</span><b>${g.actions.length}</b></div>`,confirm:'Remove',danger:true,onConfirm:()=>{state.goals=state.goals.filter(x=>x.id!==id);log('Removed development goal',competency(g.competencyId)?.name);closeDialog();toast('Goal removed.');render()}})}
    function addAction(goalId){const g=state.goals.find(x=>x.id===goalId);openDialog({title:'Add action item',body:`<div class="field"><label>Action</label><input id="act-title" placeholder="e.g. Weekly replanning checkpoint"></div><div class="field-row" style="margin-top:12px"><div class="field"><label>Type</label><select id="act-type">${ACTION_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div><div class="field"><label>Target date</label><input id="act-target" placeholder="e.g. 31 Oct 2026"></div></div><div class="validation info" style="margin-top:12px">Courses are free text in this prototype; there is no learning catalogue link.</div>`,confirm:'Add action',onConfirm:()=>{const title=document.getElementById('act-title').value.trim(),target=document.getElementById('act-target').value.trim();if(!title||!target){toast('Enter an action and a target date.','error');return}g.actions.push({id:uid('act'),title,type:document.getElementById('act-type').value,target,status:'Not started',updated:dateStamp()});log('Added action item',title);closeDialog();toast('Action added.');render()}})}
    function deleteAction(key){const [goalId,actionId]=key.split('|'),g=state.goals.find(x=>x.id===goalId),a=g.actions.find(x=>x.id===actionId);g.actions=g.actions.filter(x=>x.id!==actionId);log('Removed action item',a?.title);toast('Action removed.');render()}
    function updateActionStatus(key,status){const [goalId,actionId]=key.split('|'),a=findAction(goalId,actionId);if(!a||a.status===status){render();return}const from=a.status;a.status=status;a.updated=dateStamp();log('Updated action status',`${a.title} · ${from} → ${status}`,{goalId,actionId,from,to:status});toast('Status updated.');render();refreshActivityDialog()}
    function revertActivity(id){const entry=state.activity.find(e=>e.id===id),a=undoTarget(entry);if(!a){toast('This entry can no longer be reverted.','error');render();refreshActivityDialog();return}const {goalId,actionId,from,to}=entry.undo;a.status=from;a.updated=dateStamp();log('Reverted action status',`${a.title} · back to ${from}`,{goalId,actionId,from:to,to:from});toast(`Action moved back to ${from}.`);render();refreshActivityDialog()}
    function acknowledgeResult(){openDialog({title:'Acknowledge this result?',body:`<div class="summary-list"><span>Result</span><b>${esc(state.result.name)}</b></div><div class="summary-list"><span>Framework</span><b>${esc(state.result.framework)}</b></div><div class="field" style="margin-top:12px"><label>Comment (optional)</label><textarea id="ack-note" placeholder="Anything you want recorded alongside the acknowledgement."></textarea></div><div class="validation info" style="margin-top:12px">Acknowledgement records that you read this result. It does not change the recorded Manager Score and is not agreement or a dispute.</div>`,confirm:'Acknowledge',onConfirm:()=>{Object.assign(state.result,{acknowledged:true,acknowledgedAt:todayStamp(),acknowledgeNote:document.getElementById('ack-note').value.trim()});log('Acknowledged assessment result',state.result.name);closeDialog();toast('Result acknowledged.');render()}})}
    function requestCheckin(){openDialog({title:'Request a check-in',body:`<div class="field"><label>Topic</label><input id="ci-topic" placeholder="e.g. Progress on stakeholder alignment actions"></div><div class="field" style="margin-top:12px"><label>Preferred window</label><input id="ci-window" placeholder="e.g. Week of 25 Aug"></div><div class="field" style="margin-top:12px"><label>Context (optional)</label><textarea id="ci-note"></textarea></div><div class="validation info" style="margin-top:12px">The request appears in your Manager's follow-up list the next time they open it. No reminder or notification is sent.</div>`,confirm:'Request',onConfirm:()=>{const topic=document.getElementById('ci-topic').value.trim(),window_=document.getElementById('ci-window').value.trim();if(!topic||!window_){toast('Enter a topic and a preferred window.','error');return}state.checkins.unshift({id:uid('ci'),date:dateStamp(),topic,window:window_,status:'Requested',note:document.getElementById('ci-note').value.trim()});log('Requested check-in',topic);closeDialog();toast('Check-in requested.');render()}})}
    document.addEventListener('click',event=>{const nav=event.target.closest('[data-nav]');if(nav)navigate(nav.dataset.nav);if(event.target.closest('[data-close-dialog]'))closeDialog();if(event.target.closest('[data-close-drawer]'))closeDrawer()});
    document.getElementById('dialog-backdrop').onclick=e=>{if(e.target.id==='dialog-backdrop')closeDialog()};
    document.getElementById('drawer-backdrop').onclick=e=>{if(e.target.id==='drawer-backdrop')closeDrawer()};
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();closeDrawer()}});
    window.addEventListener('hashchange',()=>{route=(location.hash||'#overview').slice(1);render()});
    document.getElementById('reset-demo').onclick=()=>{localStorage.removeItem(STORAGE_KEY);state=deepCopy(initialState);exploredPathId=state.profile.targetPathId;activeGuideId='comp-self';evidenceTab='all';toast('Demo data reset.');navigate('overview')};
    render();
  </script>
</body>
</html>
