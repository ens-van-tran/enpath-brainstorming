    function competencyEditor(selected){const levels=state.levels.slice(0,state.levelCount),cols=state.levelCount===5?'80px repeat(5,minmax(125px,1fr))':'80px repeat(3,minmax(160px,1fr))';selected.advice=selected.advice||Array(5).fill('');return `<div class="card"><div class="section-head"><h2>${esc(selected.name)}</h2><div class="actions"><button class="button small" id="save-competency">Save</button><button class="button small primary" id="activate-competency">Activate</button></div></div><div class="level-grid" style="grid-template-columns:${cols}"><div class="level-cell head">Level</div>${levels.map((l,i)=>`<div class="level-cell head">${i+1} · ${esc(l.name)}</div>`).join('')}<div class="level-cell"><b>Behavior</b></div>${levels.map((l,i)=>`<div class="level-cell"><textarea data-behavior="${i}">${esc(selected.behaviors[i]||'')}</textarea></div>`).join('')}<div class="level-cell"><b>Advice</b></div>${levels.map((l,i)=>`<div class="level-cell"><textarea data-advice="${i}">${esc(selected.advice[i]||'')}</textarea></div>`).join('')}</div></div>`}
    function renderCompetencies(){const selected=competency(activeCompetencyId)||state.competencies[0];activeCompetencyId=selected.id;const pool=`<div class="grid two"><div class="card"><table><thead><tr><th>Competency</th><th>Levels</th><th>Status</th></tr></thead><tbody>${state.competencies.map(c=>`<tr class="clickable" data-competency-id="${c.id}" style="${c.id===selected.id?'background:var(--primary-soft)':''}"><td><b>${esc(c.name)}</b></td><td>${state.levels.slice(0,state.levelCount).map((l,i)=>`<span class="badge neutral">${i+1} · ${esc(l.name)}</span>`).join(' ')}</td><td>${badge(c.status)}</td></tr>`).join('')}</tbody></table></div><div>${competencyEditor(selected)}</div></div>`;const categories=`<div class="card"><table><thead><tr><th>Category</th><th>Assigned Managers</th><th></th></tr></thead><tbody>${state.categories.map(c=>{const assignments=categoryAssignments(c);return `<tr><td><b>${esc(c.name)}</b></td><td>${assignments.map(a=>{const p=employee(a.employeeId);return `<div><b>${esc(p?.name)}</b><span class="row-meta"> · ${esc(a.managedRole)} · ${esc(a.team)}</span></div>`}).join('')}</td><td><button class="button small" data-edit-category="${c.id}">Edit</button></td></tr>`}).join('')}</tbody></table></div>`;document.getElementById('competencies').innerHTML=pageHeader('Competencies',competencyTab==='pool'?'<button class="button primary" id="new-competency">New competency</button>':'<button class="button primary" id="add-category">Add category</button>')+`<div class="tabs"><button class="tab ${competencyTab==='pool'?'active':''}" data-competency-tab="pool">Pool</button><button class="tab ${competencyTab==='categories'?'active':''}" data-competency-tab="categories">Categories</button></div>${competencyTab==='pool'?pool:categories}`}

    function renderAssessmentReports(){document.getElementById('assessment-reports').innerHTML=pageHeader('Assessment Reports')+`<div class="card"><table><thead><tr><th>Report</th><th>Team</th><th>Template</th><th>Employee</th><th>Manager</th><th>Status</th></tr></thead><tbody>${state.reports.map(r=>`<tr><td><b>${esc(r.name)}</b><div class="row-meta">${esc(r.id)} · ${esc(r.created)}</div></td><td>${esc(r.team)}</td><td>${esc(r.framework)}</td><td>${r.employeeComplete}/${r.participants}</td><td>${r.managerComplete}/${r.participants}</td><td>${badge(r.status)}</td></tr>`).join('')}</tbody></table></div>`}
    function barsHtml(teams,selectOnly=false){return `<div class="bars">${teams.map(t=>`<button class="bar-button ${selectOnly&&t.id===companyTeamId?'selected':''}" ${selectOnly?`data-company-team="${t.id}"`:`data-team-drill="${t.id}"`}><div class="bar-track"><span class="bar-fill" style="height:${clamp((t.stats.gap||0)/2*100,0,100)}%"></span></div><b>${esc(t.short)}</b><small>Gap ${format(t.stats.gap)}</small></button>`).join('')}</div>`}
    function radarSvg(data,mode='assessment'){const count=Math.max(data.length,3),cx=160,cy=160,r=108,max=state.levelCount,point=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/count,rr=r*(v/max);return`${cx+Math.cos(a)*rr},${cy+Math.sin(a)*rr}`},polygon=fn=>data.map((d,i)=>point(i,fn(d))).join(' ');return `<div class="radar"><svg viewBox="0 0 320 320" role="img" aria-label="Radar chart">${Array.from({length:state.levelCount},(_,i)=>i+1).map(l=>`<polygon class="radar-grid" points="${data.map((d,i)=>point(i,l)).join(' ')}"></polygon>`).join('')}${data.map((d,i)=>{const o=point(i,max).split(','),label=point(i,max*1.2).split(',');return `<line class="radar-axis" x1="160" y1="160" x2="${o[0]}" y2="${o[1]}"></line><text class="radar-label" x="${label[0]}" y="${label[1]}" text-anchor="middle">${esc(d.label.length>16?d.label.slice(0,14)+'…':d.label)}</text>`}).join('')}<polygon class="radar-expected" points="${polygon(d=>d.expected??0)}"></polygon>${mode==='assessment'&&data.some(d=>d.employee!=null)?`<polygon class="radar-self" points="${polygon(d=>d.employee??0)}"></polygon>`:''}${mode==='assessment'?`<polygon class="radar-actual" points="${polygon(d=>d.manager??0)}"></polygon>`:''}${mode==='trend'?`<polygon class="radar-self" points="${polygon(d=>d.previous??0)}"></polygon><polygon class="radar-actual" points="${polygon(d=>d.manager??0)}"></polygon>`:''}</svg></div>`}
    function radarPanel(data,title,mode='assessment'){return `<div class="radar-wrap">${radarSvg(data,mode)}<div><h3>${esc(title)}</h3>${data.map(d=>`<div class="summary-list"><span>${esc(d.label)}</span><b>${mode==='template'?format(d.expected):mode==='trend'?`${format(d.previous)} → ${format(d.manager)}`:`${format(d.manager)} / ${format(d.expected)}`}</b></div>`).join('')}</div></div>`}
    function teamCompetencyInsights(team){return teamRadar(team).map(d=>({...d,gap:d.manager==null?null:d.expected-d.manager})).filter(d=>d.manager!=null)}
    function renderCompanyGaps(){const ranked=state.teams.map(t=>({...t,stats:teamStats(t)})).sort((a,b)=>(b.stats.gap||0)-(a.stats.gap||0)),selected=state.teams.find(t=>t.id===companyTeamId)||ranked[0],insights=teamCompetencyInsights(selected),strengths=[...insights].sort((a,b)=>b.manager-a.manager).slice(0,5),weaknesses=[...insights].sort((a,b)=>b.gap-a.gap).slice(0,5),list=(items,value)=>items.length?items.map((d,i)=>`<div class="insight-row"><span>${String(i+1).padStart(2,'0')}</span><b>${esc(d.label)}</b><strong>${value(d)}</strong></div>`).join(''):'<div class="empty">No known Manager scores.</div>';companyTeamId=selected.id;document.getElementById('company-gaps').innerHTML=pageHeader('Company Gaps')+`<div class="grid two"><div class="card">${barsHtml(ranked,true)}</div><div class="card"><table><thead><tr><th>Team</th><th class="numeric">Average Gap</th><th class="numeric">Coverage</th></tr></thead><tbody>${ranked.map(t=>`<tr class="clickable" data-company-team="${t.id}" style="${t.id===selected.id?'background:var(--primary-soft)':''}"><td><b>${esc(t.name)}</b></td><td class="numeric">${format(t.stats.gap)}</td><td class="numeric">${t.stats.coverage.toFixed(0)}%</td></tr>`).join('')}</tbody></table></div></div><div class="grid equal" style="margin-top:12px"><div class="card"><h2>Top strengths · ${esc(selected.name)}</h2><div class="divider"></div>${list(strengths,d=>format(d.manager))}</div><div class="card"><h2>Top weaknesses · ${esc(selected.name)}</h2><div class="divider"></div>${list(weaknesses,d=>`Gap ${format(d.gap)}`)}</div></div>`}
    function teamRadar(team){const ids=[...new Set(team.members.flatMap(m=>Object.keys(m.scores)))];return ids.map(id=>{const scores=team.members.map(m=>m.scores[id]).filter(Boolean);return{label:competency(id)?.name||id,employee:average(scores.map(s=>s.employee)),manager:average(scores.map(s=>s.manager)),previous:average(scores.map(s=>s.previous)),expected:average(scores.map(s=>s.expected))}})}
    function renderTeamGaps(){const team=state.teams.find(t=>t.id===currentTeamId)||state.teams[0],ranked=team.members.map(m=>({...m,stats:memberStats(m)})).sort((a,b)=>(b.stats.gap??-1)-(a.stats.gap??-1)),member=ranked.find(m=>m.id===currentMemberId)||ranked[0],teamData=teamRadar(team);currentTeamId=team.id;currentMemberId=member.id;const rows=Object.entries(member.scores).map(([id,score])=>({comp:competency(id),score,gap:teamGap(score)})),memberRadar=rows.map(r=>({label:r.comp?.name||'Unknown',employee:r.score.employee,manager:r.score.manager,expected:r.score.expected}));document.getElementById('team-gaps').innerHTML=pageHeader('Team Gaps',`<select class="input" id="analytics-team" style="width:220px">${state.teams.map(t=>`<option value="${t.id}" ${t.id===team.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`)+`<div class="grid equal"><div class="card">${radarPanel(teamData,`${team.name} current`)}</div><div class="card">${radarPanel(teamData,'Current vs 6 months ago','trend')}<div class="legend"><span><span class="swatch" style="background:var(--primary)"></span>Current Manager</span><span><span class="swatch line"></span>6 months ago</span></div></div></div><div class="grid equal" style="margin-top:12px"><div class="card"><h2>Members</h2><div class="divider"></div>${ranked.map((m,i)=>`<div class="rank-row ${m.id===member.id?'selected':''}" data-member="${m.id}"><span>${String(i+1).padStart(2,'0')}</span><div><b>${esc(m.name)}</b><div class="row-meta">${m.stats.known}/${m.stats.total} Manager scores</div></div><b>${format(m.stats.gap)}</b></div>`).join('')}</div><div class="card accent"><div class="section-head"><h2>${esc(member.name)}</h2><span class="badge info">Gap ${format(member.stats.gap)}</span></div>${radarPanel(memberRadar,'Member radar')}<table><thead><tr><th>Competency</th><th class="numeric">Employee</th><th class="numeric">Manager</th><th class="numeric">Expected</th><th class="numeric">Gap</th></tr></thead><tbody>${rows.map(r=>`<tr><td     function bindDynamic(){document.querySelectorAll('[data-competency-tab]').forEach(el=>el.onclick=()=>{competencyTab=el.dataset.competencyTab;render()});document.querySelectorAll('[data-competency-id]').forEach(el=>el.onclick=()=>{activeCompetencyId=el.dataset.competencyId;render()});document.querySelectorAll('[data-select-framework]').forEach(el=>el.onclick=()=>{activeFrameworkId=el.dataset.selectFramework;render()});document.querySelectorAll('[data-team-drill]').forEach(el=>el.onclick=()=>{currentTeamId=el.dataset.teamDrill;currentMemberId='';navigate('team-gaps')});document.querySelectorAll('[data-company-team]').forEach(el=>el.onclick=()=>{companyTeamId=el.dataset.companyTeam;render()});document.querySelectorAll('[data-member]').forEach(el=>el.onclick=()=>{currentMemberId=el.dataset.member;render()});document.querySelectorAll('[data-edit-category]').forEach(el=>el.onclick=()=>editCategory(el.dataset.editCategory));document.querySelectorAll('[data-framework-pick]').forEach(el=>el.onchange=()=>toggleFrameworkPick(el));document.querySelectorAll('[data-behavior]').forEach(el=>el.onchange=()=>{competency(activeCompetencyId).behaviors[Number(el.dataset.behavior)]=el.value;save()});document.querySelectorAll('[data-advice]').forEach(el=>el.onchange=()=>{competency(activeCompetencyId).advice[Number(el.dataset.advice)]=el.value;save()});document.querySelectorAll('[data-level-count]').forEach(el=>el.onclick=()=>{state.levelCount=Number(el.dataset.levelCount);save();render()});document.querySelectorAll('[data-level-name]').forEach(el=>el.onchange=()=>{state.levels[Number(el.dataset.levelName)].name=el.value;save()});document.querySelectorAll('[data-level-description]').forEach(el=>el.onchange=()=>{state.levels[Number(el.dataset.levelDescription)].description=el.value;save()});document.querySelectorAll('[data-revoke-role-manager]').forEach(el=>el.onclick=()=>revokeRoleManager(el.dataset.revokeRoleManager));const byId=id=>document.getElementById(id);if(byId('new-competency'))byId('new-competency').onclick=openDrawer;if(byId('add-category'))byId('add-category').onclick=()=>editCategory();if(byId('save-competency'))byId('save-competency').onclick=()=>{competency(activeCompetencyId).status='Draft';log('Saved competency',competency(activeCompetencyId).name);toast('Competency saved.');render()};if(byId('activate-competency'))byId('activate-competency').onclick=()=>{competency(activeCompetencyId).status='Active';log('Activated competency',competency(activeCompetencyId).name);toast('Competency activated.');render()};if(byId('save-level-model'))byId('save-level-model').onclick=()=>{log('Saved Level Model',`${state.levelCount} levels`);toast('Level Model saved.')};if(byId('save-template'))byId('save-template').onclick=()=>{framework(activeFrameworkId).status='Draft';log('Saved Framework Template',framework(activeFrameworkId).name);toast('Template saved.');render()};if(byId('publish-template'))byId('publish-template').onclick=publishTemplate;if(byId('analytics-team'))byId('analytics-team').onchange=e=>{currentTeamId=e.target.value;currentMemberId='';render()};if(byId('assign-role-manager'))byId('assign-role-manager').onclick=assignRoleManager;if(byId('audit-search'))byId('audit-search').oninput=e=>byId('audit-entries').innerHTML=auditRows(e.target.value);if(byId('export-audit'))byId('export-audit').onclick=exportAudit}
    function editCategory(id){const item=category(id),assignments=activeRoleManagers(),selected=new Set(item?.assignmentIds||[]);openDialog({title:item?'Edit Category':'Add Category',body:`<div class="field"><label>Name</label><input id="category-name" value="${esc(item?.name||'')}"></div><div class="card" style="margin-top:12px">${assignments.map(a=>{const p=employee(a.employeeId);return `<label class="check-row"><input type="checkbox" data-category-assignment value="${a.id}" ${selected.has(a.id)?'checked':''}><span><b>${esc(p?.name)}</b><span class="row-meta"> · ${esc(a.managedRole)} · ${esc(a.team)}</span></span></label>`}).join('')}</div>`,confirm:'Save',onConfirm:()=>{const name=document.getElementById('category-name').value.trim(),assignmentIds=[...document.querySelectorAll('[data-category-assignment]:checked')].map(el=>el.value);if(!name||!assignmentIds.length){toast('Enter a name and select a Manager.','error');return}if(item)Object.assign(item,{name,assignmentIds});else state.categories.push({id:uid('cat'),name,assignmentIds});log(item?'Updated Category':'Created Category',name);closeDialog();toast('Category saved.');render()}})}
    function toggleFrameworkPick(el){const [fwId,catId,compId]=el.dataset.frameworkPick.split('|'),fc=framework(fwId).categories.find(c=>c.categoryId===catId),set=new Set(fc.competencyIds);el.checked?set.add(compId):set.delete(compId);fc.competencyIds=[...set];save();render()}
    function publishTemplate(){const f=framework(activeFrameworkId);openDialog({title:'Public this template?',body:`<div class="summary-list"><span>Template</span><b>${esc(f.name)}</b></div><div class="summary-list"><span>Competencies</span><b>${f.categories.reduce((n,c)=>n+c.competencyIds.length,0)}</b></div>`,confirm:'Public',onConfirm:()=>{f.status='Public';log('Public Framework Template',f.name);closeDialog();toast('Template is public.');render()}})}
    function assignRoleManager(){openDialog({title:'Assign Manager',body:`<div class="field"><label>Employee</label><select id="rm-employee">${state.employees.map(e=>`<option value="${e.id}">${esc(e.name)} · ${esc(e.role)} · ${esc(e.team)}</option>`).join('')}</select></div>`,confirm:'Assign',onConfirm:()=>{const person=employee(document.getElementById('rm-employee').value);if(activeRoleManagers().some(a=>a.employeeId===person.id&&a.managedRole===person.role&&a.team===person.team)){toast('This assignment already exists.','error');return}state.roleManagers.push({id:uid('rm'),employeeId:person.id,managedRole:person.role,team:person.team,status:'Active',effective:todayStamp(),assignedBy:'HR Admin'});log('Assigned Role Manager',person.name);closeDialog();toast('Manager assigned.');render()}})}
    function revokeRoleManager(id){const a=state.roleManagers.find(x=>x.id===id);a.status='Revoked';log('Revoked Role Manager',employee(a.employeeId)?.name);toast('Assignment revoked.');render()}
    function exportAudit(){const content=['Time,Actor,Action,Object',...state.audit.map(e=>[e.time,e.actor,e.action,e.object].map(v=>`"${String(v).replaceAll('"','""')}"`).join(','))].join('\n'),blob=new Blob([content],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='enpath-audit-log.csv';a.click();URL.revokeObjectURL(url)}
    document.addEventListener('click',event=>{const nav=event.target.closest('[data-nav]');if(nav)navigate(nav.dataset.nav);if(event.target.closest('[data-close-dialog]'))closeDialog();if(event.target.closest('[data-close-drawer]'))closeDrawer()});document.getElementById('dialog-backdrop').onclick=e=>{if(e.target.id==='dialog-backdrop')closeDialog()};document.getElementById('drawer-backdrop').onclick=e=>{if(e.target.id==='drawer-backdrop')closeDrawer()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();closeDrawer()}});window.addEventListener('hashchange',()=>{route=(location.hash||'#overview').slice(1);render()});document.getElementById('reset-demo').onclick=()=>{localStorage.removeItem(STORAGE_KEY);state=deepCopy(initialState);competencyTab='pool';toast('Demo data reset.');navigate('overview')};render();
  </script>
</body>
