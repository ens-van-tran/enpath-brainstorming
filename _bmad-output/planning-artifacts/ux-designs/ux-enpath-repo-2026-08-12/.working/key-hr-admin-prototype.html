    function barsHtml(items){return `<div class="bars">${items.map(item=>{const gap=item.stats?.gap??teamStats(item).gap,value=gap==null?null:clamp((4-gap)/4*100,0,100);return `<button class="bar-button" data-team-drill="${item.id}"><div class="bar-track">${value==null?'':`<div class="bar-fill" style="height:${value}%"></div>`}</div><b>${esc(item.short||item.name)}</b><small>Gap ${format(gap)}</small></button>`}).join('')}</div><div class="legend"><span><i class="swatch" style="background:var(--actual)"></i>Manager recorded</span><span><i class="swatch" style="border:2px solid var(--border-strong)"></i>Expected</span></div>`}
    function radarSvg(data){const count=Math.max(data.length,3),size=320,cx=160,cy=160,r=108,max=state.levelCount,point=(i,value)=>{const angle=-Math.PI/2+i*2*Math.PI/count,rr=r*(value/max);return`${cx+Math.cos(angle)*rr},${cy+Math.sin(angle)*rr}`},polygon=valueFn=>data.map((d,i)=>point(i,valueFn(d))).join(' ');return `<div class="radar"><svg viewBox="0 0 ${size} ${size}" role="img" aria-label="Radar skill chart">${[1,2,3,4,5].slice(0,state.levelCount).map(level=>`<polygon class="radar-grid" points="${data.map((d,i)=>point(i,level)).join(' ')}"></polygon>`).join('')}${data.map((d,i)=>{const outer=point(i,max).split(','),label=point(i,max*1.2).split(',');return `<line class="radar-axis" x1="${cx}" y1="${cy}" x2="${outer[0]}" y2="${outer[1]}"></line><text class="radar-label" x="${label[0]}" y="${label[1]}" text-anchor="middle">${esc(d.label.length>16?d.label.slice(0,14)+'…':d.label)}</text>`}).join('')}<polygon class="radar-expected" points="${polygon(d=>d.expected??0)}"></polygon>${data.some(d=>d.employee!=null)?`<polygon class="radar-self" points="${polygon(d=>d.employee??0)}"></polygon>`:''}<polygon class="radar-actual" points="${polygon(d=>d.manager??d.actual??0)}"></polygon></svg></div>`}
    function radarPanel(data,title,managerLabel='Manager · recorded',expectedLabel='Expected',explanation='Manager Score is recorded. Employee Score is shown only for comparison.'){return `<div class="radar-wrap"><div>${radarSvg(data)}<div class="legend"><span><i class="swatch" style="background:var(--actual)"></i>${esc(managerLabel)}</span>${data.some(d=>d.employee!=null)?'<span><i class="swatch line"></i>Employee · reference</span>':''}<span><i class="swatch" style="border:2px solid var(--expected)"></i>${esc(expectedLabel)}</span></div></div><div><h3>${esc(title)}</h3><p class="muted fine">${esc(explanation)}</p>${data.map(d=>`<div class="summary-list"><span>${esc(d.label)}</span><b>${d.employee!=null?`${format(d.employee)} ref · `:''}${format(d.manager??d.actual)} / ${format(d.expected)}</b></div>`).join('')}</div></div>`}
    function teamRadar(team){const ids=[...new Set(team.members.flatMap(m=>Object.keys(m.scores||{})))];return ids.map(id=>({label:competency(id)?.name||id,employee:average(team.members.map(m=>m.scores[id]?.employee)),manager:average(team.members.map(m=>m.scores[id]?.manager)),expected:average(team.members.map(m=>m.scores[id]?.expected))}))}
    function renderCompanyGaps(){const ranked=state.teams.filter(t=>t.frameworkId).map(t=>({...t,stats:teamStats(t)})).sort((a,b)=>(b.stats.gap||0)-(a.stats.gap||0));document.getElementById('company-gaps').innerHTML=pageHeader('Analytics · Company','Company Gaps','Compare team Average Gap using recorded Manager Scores.',`<button class="button" data-nav="team-gaps">Open team radar</button>`,`<span class="chip">Gap = Expected - Manager</span><span class="chip">Unknown excluded</span>`)+`<div class="grid two"><div class="card"><div class="section-head"><div><h2>Average Gap by team</h2><p>Employee self-assessment does not affect the ranking.</p></div></div>${barsHtml(ranked)}</div><div class="card"><h2>Ranked numeric view</h2><table style="margin-top:12px"><thead><tr><th>Team</th><th>Framework</th><th class="numeric">Gap</th><th class="numeric">Manager coverage</th><th></th></tr></thead><tbody>${ranked.map((t,i)=>`<tr><td>${i+1}. <b>${esc(t.name)}</b></td><td>${esc(framework(t.frameworkId)?.version||'')}</td><td class="numeric">${format(t.stats.gap)}</td><td class="numeric">${t.stats.coverage.toFixed(0)}%</td><td><button class="button small" data-team-drill="${t.id}">Inspect radar</button></td></tr>`).join('')}</tbody></table></div></div>`}
    function renderTeamGaps(){const team=state.teams.find(t=>t.id===currentTeamId&&t.frameworkId)||state.teams.find(t=>t.frameworkId),ranked=team.members.map(m=>({...m,stats:memberStats(m)})).sort((a,b)=>(b.stats.gap??-1)-(a.stats.gap??-1)),member=ranked.find(m=>m.id===currentMemberId)||ranked[0];currentTeamId=team.id;currentMemberId=member.id;const rows=Object.entries(member.scores).map(([id,score])=>({comp:competency(id),score,gap:teamGap(score)})),known=rows.filter(r=>r.score.manager!=null),highest=[...known].sort((a,b)=>b.gap-a.gap)[0],levelIndex=highest?clamp(Math.round(highest.score.manager),1,state.levelCount)-1:0,memberRadar=rows.map(r=>({label:r.comp?.name||'Unknown',employee:r.score.employee,manager:r.score.manager,expected:r.score.expected}));document.getElementById('team-gaps').innerHTML=pageHeader('Analytics · Radar profiles','Team Gaps','Compare expected, recorded Manager Scores and reference-only Employee Scores.',`<select class="input" id="analytics-team" style="width:220px">${state.teams.filter(t=>t.frameworkId).map(t=>`<option value="${t.id}" ${t.id===team.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`,`<span class="chip">${esc(framework(team.frameworkId)?.version||'')}</span><span class="chip">Manager Score is recorded</span>`)+`<div class="card"><div class="section-head"><div><h2>${esc(team.name)} radar</h2><p>Team average by framework competency.</p></div></div>${radarPanel(teamRadar(team),'Team capability shape')}</div><div class="grid equal" style="margin-top:16px"><div class="card"><div class="section-head"><div><h2>Member ranking</h2><p>Average gap based on Manager Scores.</p></div><span class="badge warn">${teamStats(team).coverage.toFixed(0)}% manager coverage</span></div>${ranked.map((m,i)=>`<div class="rank-row ${m.id===member.id?'selected':''}"><span class="rule">${String(i+1).padStart(2,'0')}</span><div><b>${esc(m.name)}</b><div class="row-meta">${m.stats.known}/${m.stats.total} Manager scores</div></div><b>${format(m.stats.gap)}</b><button class="button small" data-member="${m.id}">Inspect</button></div>`).join('')}</div><div class="stack"><div class="card accent"><div class="section-head"><div><h2>${esc(member.name)} radar</h2><p>${esc(member.role)} · ${esc(member.level)}</p></div><span class="badge info">Gap ${format(member.stats.gap)}</span></div>${radarPanel(memberRadar,'Individual capability shape')}</div>${highest?`<div class="advice"><b>Improve ${esc(highest.comp?.name||'this skill')} · Recorded Level ${levelIndex+1}</b><br>${esc(highest.comp?.advice[levelIndex]||'No advice configured for this level.')}<div class="fine" style="margin-top:6px">Advice uses the Manager-recorded level. Employee Score remains reference-only.</div></div>`:'<div class="unknown">No Manager Score is available.</div>'}<div class="card"><h2>Numeric equivalent</h2><table style="margin-top:12px"><thead><tr><th>Competency</th><th class="numeric">Employee ref.</th><th class="numeric">Manager recorded</th><th class="numeric">Expected</th><th class="numeric">Gap</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.comp?.name||'Unknown')}</td><td class="numeric">${format(r.score.employee)}</td><td class="numeric">${format(r.score.manager)}</td><td class="numeric">${format(r.score.expected)}</td><td class="numeric">${format(r.gap)}</td></tr>`).join('')}</tbody></table></div></div></div>`}
    function renderVersionHistory(){document.getElementById('version-history').innerHTML=pageHeader('Governance · Continuous history','Version History','Framework versions remain active until a reviewed replacement is activated; assessment periods do not control activation.')+`<div class="card"><div class="timeline">${state.versions.map(v=>`<div class="timeline-item"><div class="section-head"><div><h3>${esc(v.name)}</h3><p>${esc(v.id)} · ${esc(v.effective)} · ${esc(v.owner)}</p></div>${badge(v.status)}</div><p>${esc(v.note)}</p></div>`).join('')}</div></div>`}
    function auditRows(query){const q=query.toLowerCase(),rows=state.audit.filter(e=>Object.values(e).some(v=>String(v).toLowerCase().includes(q)));return rows.length?rows.map(e=>`<div class="audit-entry"><span class="fine muted">${esc(e.time)}</span><b>${esc(e.actor)}</b><span>${esc(e.action)}</span><span class="rule">${esc(e.object)}</span></div>`).join(''):'<div class="empty">No matching events.</div>'}
    function renderAuditLog(){document.getElementById('audit-log').innerHTML=pageHeader('Governance · Accountable changes','Audit Log','Trace pool, Category, Framework and assessment changes.',`<button class="button" id="export-audit">Export visible log</button>`)+`<div class="card"><div class="toolbar"><div class="field"><label>Search audit entries</label><input id="audit-search" placeholder="Actor, action or object"></div><span class="chip">${state.audit.length} events</span></div><div id="audit-entries">${auditRows('')}</div></div>`}
    const renderers={overview:renderOverview,'competency-pool':renderCompetencyPool,categories:renderCategories,frameworks:renderFrameworks,'level-model':renderLevelModel,'framework-reviews':renderFrameworkReviews,'assessment-cycles':renderAssessmentCycles,'generate-assessment':renderGenerateAssessment,'company-gaps':renderCompanyGaps,'team-gaps':renderTeamGaps,'version-history':renderVersionHistory,'audit-log':renderAuditLog};
    function bindDynamic(){document.querySelectorAll('[data-open-framework]').forEach(el=>el.onclick=()=>{activeFrameworkId=el.dataset.openFramework;navigate('frameworks')});document.querySelectorAll('[data-select-framework]').forEach(el=>el.onclick=()=>{activeFrameworkId=el.dataset.selectFramework;render()});document.querySelectorAll('[data-review-framework]').forEach(el=>el.onclick=()=>{activeFrameworkId=el.dataset.reviewFramework;render()});document.querySelectorAll('[data-team-drill]').forEach(el=>el.onclick=()=>{currentTeamId=el.dataset.teamDrill;currentMemberId='';navigate('team-gaps')});document.querySelectorAll('[data-member]').forEach(el=>el.onclick=()=>{currentMemberId=el.dataset.member;render()});document.querySelectorAll('[data-level-count]').forEach(el=>el.onclick=()=>{state.levelCount=Number(el.dataset.levelCount);save();render()});document.querySelectorAll('[data-level-name]').forEach(el=>el.onchange=()=>{state.levels[Number(el.dataset.levelName)].name=el.value;save();render()});document.querySelectorAll('[data-level-description]').forEach(el=>el.onchange=()=>{state.levels[Number(el.dataset.levelDescription)].description=el.value;save();render()});document.querySelectorAll('[data-behavior]').forEach(el=>el.onchange=()=>{competency(activeCompetencyId).behaviors[Number(el.dataset.behavior)]=el.value;save();render()});document.querySelectorAll('[data-advice]').forEach(el=>el.onchange=()=>{competency(activeCompetencyId).advice[Number(el.dataset.advice)]=el.value;save();render()});document.querySelectorAll('[data-edit-category]').forEach(el=>el.onclick=()=>editCategory(el.dataset.editCategory));document.querySelectorAll('[data-framework-pick]').forEach(el=>el.onchange=()=>toggleFrameworkPick(el));document.querySelectorAll('[data-participant]').forEach(el=>el.onchange=()=>{const ids=new Set(state.generation.selected);el.checked?ids.add(el.dataset.participant):ids.delete(el.dataset.participant);state.generation.selected=[...ids];save();render()});document.querySelectorAll('[data-progress-cycle]').forEach(el=>el.onclick=()=>progressCycle(el.dataset.progressCycle));const byId=id=>document.getElementById(id);if(byId('competency-select'))byId('competency-select').onchange=e=>{activeCompetencyId=e.target.value;render()};if(byId('new-competency'))byId('new-competency').onclick=newCompetency;if(byId('comp-name'))byId('comp-name').onchange=e=>{competency(activeCompetencyId).name=e.target.value;save();render()};if(byId('comp-description'))byId('comp-description').onchange=e=>{competency(activeCompetencyId).description=e.target.value;save();render()};if(byId('save-competency'))byId('save-competency').onclick=()=>{competency(activeCompetencyId).status='Draft';log('Saved pool competency draft',competency(activeCompetencyId).name);toast('Pool competency draft saved.');render()};if(byId('activate-competency'))byId('activate-competency').onclick=()=>{competency(activeCompetencyId).status='Active';log('Activated pool competency version',competency(activeCompetencyId).name);toast('Competency version activated.');render()};if(byId('add-category'))byId('add-category').onclick=()=>editCategory();if(byId('save-framework'))byId('save-framework').onclick=()=>{framework(activeFrameworkId).status='Draft';log('Saved role framework draft',framework(activeFrameworkId).name);toast('Framework draft saved.');render()};if(byId('submit-framework'))byId('submit-framework').onclick=()=>{const f=framework(activeFrameworkId);f.status='In review';f.blocking=f.categories.some(c=>c.competencyIds.length===0)?1:0;log('Submitted role framework for review',f.name,f.owner);toast('Framework submitted for HR review.');render()};if(byId('save-level-model'))byId('save-level-model').onclick=saveLevelModel;if(byId('request-changes'))byId('request-changes').onclick=requestChanges;if(byId('activate-framework'))byId('activate-framework').onclick=activateFramework;if(byId('generation-name'))byId('generation-name').onchange=e=>{state.generation.name=e.target.value;save()};if(byId('generation-team'))byId('generation-team').onchange=e=>{state.generation.teamId=e.target.value;const t=state.teams.find(x=>x.id===e.target.value);state.generation.selected=t.members.filter(m=>m.eligible&&t.frameworkId).map(m=>m.id);save();render()};if(byId('select-eligible'))byId('select-eligible').onclick=()=>{const t=state.teams.find(x=>x.id===state.generation.teamId);state.generation.selected=t.members.filter(m=>m.eligible&&t.frameworkId).map(m=>m.id);save();render()};if(byId('generate-cycle'))byId('generate-cycle').onclick=generateCycle;if(byId('analytics-team'))byId('analytics-team').onchange=e=>{currentTeamId=e.target.value;currentMemberId='';render()};if(byId('audit-search'))byId('audit-search').oninput=e=>{byId('audit-entries').innerHTML=auditRows(e.target.value)};if(byId('export-audit'))byId('export-audit').onclick=exportAudit}
    function newCompetency(){const item={id:uid('comp'),name:'Untitled competency',owner:'HR/L&D',status:'Draft',description:'',behaviors:Array(5).fill(''),advice:Array(5).fill('')};state.competencies.push(item);activeCompetencyId=item.id;log('Created pool competency draft',item.name);render();toast('New pool competency created.')}
    function editCategory(id){const item=category(id);openDialog({eyebrow:'Framework Category',title:item?'Edit Category':'Add Category',body:`<div class="field"><label>Category name</label><input id="category-name" value="${esc(item?.name||'')}"></div><div class="field" style="margin-top:12px"><label>Description</label><textarea id="category-description">${esc(item?.description||'')}</textarea></div><div class="field-row" style="margin-top:12px"><div class="field"><label>Manager</label><input id="category-manager" value="${esc(item?.manager||'Trí Nguyễn')}"></div><div class="field"><label>Team</label><input id="category-team" value="${esc(item?.team||'Platform Team')}"></div></div><div class="field" style="margin-top:12px"><label>Role scope</label><input id="category-role" value="${esc(item?.role||'Software Engineer')}"></div>`,confirm:item?'Save Category':'Add Category',onConfirm:()=>{const data={name:document.getElementById('category-name').value.trim(),description:document.getElementById('category-description').value.trim(),manager:document.getElementById('category-manager').value.trim(),team:document.getElementById('category-team').value.trim(),role:document.getElementById('category-role').value.trim()};if(Object.values(data).some(v=>!v)){toast('Complete all Category fields.','error');return}if(item)Object.assign(item,data);else state.categories.push({id:uid('cat'),...data});log(item?'Updated Category':'Created Category',data.name);closeDialog();toast('Category register updated.');render()}})}
    function toggleFrameworkPick(el){const [fwId,catId,compId]=el.dataset.frameworkPick.split('|'),fc=framework(fwId).categories.find(c=>c.categoryId===catId),set=new Set(fc.competencyIds);el.checked?set.add(compId):set.delete(compId);fc.competencyIds=[...set];save();render()}
    function saveLevelModel(){openDialog({eyebrow:'Immutable version',title:'Create a new Level Model version?',body:`<p>This creates a new ${state.levelCount}-level vocabulary. Pool competencies require matching behaviors and improvement advice for every level.</p>`,confirm:'Create version',onConfirm:()=>{const id=`LM-${state.versions.filter(v=>v.id.startsWith('LM-')).length+3}`;state.versions.unshift({id,name:`Level Model · ${state.levelCount} levels`,status:'Active',effective:todayStamp(),owner:'Mai Thy',note:'Shared level vocabulary updated without rewriting history.'});log('Activated Level Model version',id);closeDialog();toast(`${id} activated.`);render()}})}
    function requestChanges(){const f=framework(activeFrameworkId);openDialog({eyebrow:'Manager-owned framework',title:'Request changes',body:`<p>Return ${esc(f.name)} ${esc(f.version)} to ${esc(f.owner)} without changing their selection.</p><div class="field"><label>Required reason</label><textarea id="change-reason" placeholder="Explain the missing Category, competency, behavior or advice coverage."></textarea></div><label class="check-row" style="margin-top:12px"><input type="checkbox" id="simulate-resubmit" checked> Simulate corrected Manager resubmission</label>`,confirm:'Send request',onConfirm:()=>{const reason=document.getElementById('change-reason').value.trim();if(!reason){toast('A reason is required.','error');return}f.status='Changes requested';log('Requested framework changes',f.name);if(document.getElementById('simulate-resubmit').checked){f.status='In review';f.blocking=0;log('Resubmitted corrected framework',f.name,f.owner)}closeDialog();toast('Change request recorded.');render()}})}
    function activateFramework(){const f=framework(activeFrameworkId);if(f.blocking){toast('Resolve blocking validation first.','error');return}openDialog({eyebrow:'Continuous activation',title:`Activate ${f.version}?`,body:`<p>This version becomes active immediately and remains active until a later reviewed version replaces it. It is not tied to a performance-review period.</p><div class="summary-list"><span>Framework</span><b>${esc(f.name)}</b></div><div class="summary-list"><span>Composition</span><b>${f.categories.reduce((n,c)=>n+c.competencyIds.length,0)} competencies</b></div>`,confirm:'Activate version',onConfirm:()=>{f.status='Active';state.versions.unshift({id:`${f.id.toUpperCase()}-${f.version}`,name:`${f.name} ${f.version}`,status:'Active',effective:todayStamp(),owner:'Mai Thy',note:'Activated continuously after HR review; not associated with an assessment period.'});log('Activated role framework version',`${f.name} ${f.version}`);closeDialog();toast(`${f.version} is now active.`);render()}})}
    function generateCycle(){const team=state.teams.find(t=>t.id===state.generation.teamId),fw=framework(team.frameworkId),members=team.members.filter(m=>state.generation.selected.includes(m.id)&&m.eligible);openDialog({eyebrow:'Assessment snapshot',title:'Generate assessments?',body:`<div class="summary-list"><span>Name</span><b>${esc(state.generation.name)}</b></div><div class="summary-list"><span>Participants</span><b>${members.length}</b></div><div class="summary-list"><span>Framework snapshot</span><b>${esc(fw?.version||'None')}</b></div><div class="summary-list"><span>Recorded result</span><b>Manager Score</b></div><div class="summary-list"><span>Gap rule</span><b>Expected - Manager</b></div>`,confirm:'Generate assessments',onConfirm:()=>{const id=`AS-2026-${String(state.cycles.length+15).padStart(3,'0')}`;state.cycles.unshift({id,name:state.generation.name,team:team.name,participants:members.length,employeeComplete:0,managerComplete:0,status:'In progress',framework:fw.version,created:todayStamp()});log('Generated on-demand assessment',id);closeDialog();toast(`${id} generated.`);navigate('assessment-cycles')}})}
    function progressCycle(id){const cycle=state.cycles.find(c=>c.id===id);cycle.employeeComplete=cycle.participants;cycle.managerComplete=cycle.participants;cycle.status='Complete';log('Completed assessment activity',id,'Demo fixture');toast(`${id} marked complete.`);render()}
    function exportAudit(){const content=['Time,Actor,Action,Object',...state.audit.map(e=>[e.time,e.actor,e.action,e.object].map(v=>`"${String(v).replaceAll('"','""')}"`).join(','))].join('\n'),blob=new Blob([content],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='enpath-audit-log.csv';a.click();URL.revokeObjectURL(url);toast('Audit log exported.')}
    document.addEventListener('click',event=>{const nav=event.target.closest('[data-nav]');if(nav)navigate(nav.dataset.nav);if(event.target.closest('[data-close-dialog]'))closeDialog()});document.getElementById('dialog-backdrop').addEventListener('click',event=>{if(event.target.id==='dialog-backdrop')closeDialog()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDialog()});window.addEventListener('hashchange',()=>{route=(location.hash||'#overview').slice(1);render()});document.getElementById('reset-demo').onclick=()=>openDialog({eyebrow:'Prototype controls',title:'Reset all demo data?',body:'<p>This restores the original pool, Categories, Frameworks and analytics fixtures.</p>',confirm:'Reset demo data',danger:true,onConfirm:()=>{localStorage.removeItem(STORAGE_KEY);state=deepCopy(initialState);closeDialog();toast('Demo data restored.');navigate('overview')}});render();
