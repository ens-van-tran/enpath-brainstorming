      competencies:[
        {id:'comp-self',name:'Self-Management',description:'Plans and completes work without creating avoidable delivery risk.',owner:'HR Admin',status:'Active',scoreAnchors:['Needs frequent reminders.','Completes routine work with support.','Meets agreed commitments.','Replans early when conditions change.','Creates sustainable working standards.'],advice:['Use a daily checklist.','Plan the week before starting.','Review priorities when scope changes.','Protect focus across competing work.','Coach others on sustainable planning.'],rubrics:[{role:'Software Engineer',level:'L2',criteria:'Delivery & Execution',below:'Misses deadlines, waits for repeated reminders, or does not track dependencies.',meet:'Completes assigned work on time, tracks progress, and raises delivery risk early.',above:'Prioritizes parallel work independently and keeps delivery quality stable.'}]},

    function renderTeamGaps(){const team=state.teams.find(t=>t.id===currentTeamId)||state.teams[0],ranked=team.members.map(m=>({...m,stats:memberStats(m)})).sort((a,b)=>(b.stats.gap??-1)-(a.stats.gap??-1)),member=ranked.find(m=>m.id===currentMemberId)||ranked[0],teamData=teamRadar(team);currentTeamId=team.id;currentMemberId=member.id;const rows=Object.entries(member.scores).map(([id,score])=>({comp:competency(id),score,gap:teamGap(score)})),memberRadar=rows.map(r=>({label:r.comp?.name||'Unknown',employee:r.score.employee,manager:r.score.manager,expected:r.score.expected}));document.getElementById('team-gaps').innerHTML=pageHeader('Team Gaps',`<select class="input" id="analytics-team" style="width:220px">${state.teams.map(t=>`<option value="${t.id}" ${t.id===team.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`)+`<div class="grid equal"><div class="card">${radarPanel(teamData,`${team.name} current`)}</div><div class="card">${radarPanel(teamData,'Current vs 6 months ago','trend')}<div class="legend"><span><span class="swatch"></span>Current Manager</span><span><span class="swatch line"></span>6 months ago</span></div></div></div><div class="grid equal" style="margin-top:12px"><div class="card"><h2>Members</h2><div class="divider"></div>${ranked.map((m,i)=>`<div class="rank-row ${m.id===member.id?'selected':''}" data-member="${m.id}"><span>${String(i+1).padStart(2,'0')}</span><div><b>${esc(m.name)}</b><div class="row-meta">${m.stats.known}/${m.stats.total} Manager scores</div></div><b>${format(m.stats.gap)}</b></div>`).join('')}</div><div class="card accent"><div class="section-head"><h2>${esc(member.name)}</h2><span class="badge info">Gap ${format(member.stats.gap)}</span></div>${radarPanel(memberRadar,'Member radar')}<table><thead><tr><th>Competency</th><th class="numeric">Employee</th><th class="numeric">Manager</th><th class="numeric">Expected</th><th class="numeric">Gap</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.comp?.name)}</td><td class="numeric">${format(r.score.employee)}</td><td class="numeric">${format(r.score.manager)}</td><td class="numeric">${format(r.score.expected)}</td><td class="numeric">${format(r.gap)}</td></tr>`).join('')}</tbody></table></div></div>`}
    function templateRadar(f){const ids=[...new Set(f.categories.flatMap(c=>c.competencyIds))];return ids.map((id,i)=>({label:competency(id)?.name||id,expected:Math.min(state.levelCount,3.5+(i%3)*.25)}))}
    function templateEditor(f){return `<div class="stack"><div class="card"><div class="section-head"><div><h2>${esc(f.name)}</h2><div class="row-meta">${esc(f.team)} · ${esc(f.role)} · ${esc(f.owner)}</div></div>${badge(f.status)}</div>${f.categories.map((fc,index)=>{const cat=category(fc.categoryId);return `<details class="framework-category" ${index===0?'open':''}><summary><b>${esc(cat?.name)}</b><span class="badge neutral">${fc.competencyIds.length} selected</span></summary><div class="framework-category-body"><div class="pool-picker">${state.competencies.map(c=>`<label class="pool-choice"><input type="checkbox" data-framework-pick="${f.id}|${fc.categoryId}|${c.id}" ${fc.competencyIds.includes(c.id)?'checked':''}><span><b>${esc(c.name)}</b></span></label>`).join('')}</div></div></details>`}).join('')}</div><div class="card"><h2>Expected profile</h2><div class="divider"></div>${radarPanel(templateRadar(f),'Template radar','template')}</div></div>`}
    function renderFrameworkTemplates(){const selected=framework(activeFrameworkId)||state.frameworks[0];activeFrameworkId=selected.id;document.getElementById('framework-templates').innerHTML=pageHeader('Framework Templates',`<button class="button" id="save-template">Save</button><button class="button primary" id="publish-template" ${selected.status==='Public'?'disabled':''}>Public</button>`)+`<div class="template-layout"><div class="card"><h2>Templates</h2><div class="divider"></div>${state.frameworks.map(f=>`<button class="template-item ${f.id===selected.id?'active':''}" data-select-framework="${f.id}"><div class="actions" style="justify-content:space-between"><b>${esc(f.name)}</b>${badge(f.status)}</div><div class="row-meta">${esc(f.team)}</div></button>`).join('')}</div>${templateEditor(selected)}</div>`}
    function renderRoleManagers(){const managers=`<div class="card"><table><thead><tr><th>Employee</th><th>Scope</th><th>Effective</th><th>Status</th><th></th></tr></thead><tbody>${state.roleManagers.map(a=>{const p=employee(a.employeeId);return `<tr><td><b>${esc(p?.name)}</b><div class="row-meta">${esc(p?.level||'')}</div></td><td>${esc(a.managedRole)}<div class="row-meta">${esc(a.team)}</div></td><td>${esc(a.effective)}</td><td>${badge(a.status)}</td><td>${a.status==='Active'?`<button class="button small danger" data-revoke-role-manager="${a.id}">Revoke</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`,employees=`<div class="card"><table><thead><tr><th>Employee</th><th>Team</th><th>Role</th><th>Level</th><th>Status</th></tr></thead><tbody>${state.employees.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="row-meta">${esc(p.source||'Imported')}</div></td><td>${esc(p.team)}</td><td>${esc(p.role)}</td><td>${esc(p.level||'Unknown')}</td><td>${badge(p.status)}</td></tr>`).join('')}</tbody></table></div>`;document.getElementById('role-managers').innerHTML=pageHeader('People & Managers',peopleTab==='managers'?'<button class="button primary" id="assign-role-manager">Assign Manager</button>':'<button class="button primary" id="import-employees">Import employees</button>')+`<div class="tabs"><button class="tab ${peopleTab==='managers'?'active':''}" data-people-tab="managers">Role Managers</button><button class="tab ${peopleTab==='employees'?'active':''}" data-people-tab="employees">Employee Import</button></div>${peopleTab==='managers'?managers:employees}`}
    function auditRows(query){const q=query.toLowerCase(),rows=state.audit.filter(e=>Object.values(e).some(v=>String(v).toLowerCase().includes(q)));return rows.length?rows.map(e=>`<div class="audit-entry"><span class="fine muted">${esc(e.time)}</span><b>${esc(e.actor)}</b><span>${esc(e.action)}</span><span>${esc(e.object)}</span></div>`).join(''):'<div class="empty">No events.</div>'}
    function renderAuditLog(){document.getElementById('audit-log').innerHTML=pageHeader('Audit Log','<button class="button" id="export-audit">Export</button>')+`<div class="card"><div class="field" style="max-width:320px;margin-bottom:12px"><label>Search</label><input id="audit-search"></div><div id="audit-entries">${auditRows('')}</div></div>`}
    const renderers={overview:renderOverview,competencies:renderCompetencies,'level-model':renderLevelModel,'assessment-reports':renderAssessmentReports,'company-gaps':renderCompanyGaps,'team-gaps':renderTeamGaps,'framework-templates':renderFrameworkTemplates,'role-managers':renderRoleManagers,'audit-log':renderAuditLog};
    function bindDynamic(){document.querySelectorAll('[data-competency-tab]').forEach(el=>el.onclick=()=>{competencyTab=el.dataset.competencyTab;render()});document.querySelectorAll('[data-people-tab]').forEach(el=>el.onclick=()=>{peopleTab=el.dataset.peopleTab;render()});document.querySelectorAll('[data-competency-id]').forEach(el=>el.onclick=()=>{activeCompetencyId=el.dataset.competencyId;activeRubricIndex=0;render()});document.querySelectorAll('[data-select-framework]').forEach(el=>el.onclick=()=>{activeFrameworkId=el.dataset.selectFramework;render()});document.querySelectorAll('[data-team-drill]').forEach(el=>el.onclick=()=>{currentTeamId=el.dataset.teamDrill;currentMemberId='';navigate('team-gaps')});document.querySelectorAll('[data-company-team]').forEach(el=>el.onclick=()=>{companyTeamId=el.dataset.companyTeam;render()});document.querySelectorAll('[data-member]').forEach(el=>el.onclick=()=>{currentMemberId=el.dataset.member;render()});document.querySelectorAll('[data-edit-category]').forEach(el=>el.onclick=()=>editCategory(el.dataset.editCategory));document.querySelectorAll('[data-view-evidence]').forEach(el=>el.onclick=()=>viewEvidence(el.dataset.viewEvidence));document.querySelectorAll('[data-framework-pick]').forEach(el=>el.onchange=()=>toggleFrameworkPick(el));document.querySelectorAll('[data-score-anchor]').forEach(el=>el.onchange=()=>{competency(activeCompetencyId).scoreAnchors[Number(el.dataset.scoreAnchor)]=el.value;save()});document.querySelectorAll('[data-advice]').forEach(el=>el.onchange=()=>{competency(activeCompetencyId).advice[Number(el.dataset.advice)]=el.value;save()});document.querySelectorAll('[data-rubric-field]').forEach(el=>el.onchange=()=>{competency(activeCompetencyId).rubrics[activeRubricIndex][el.dataset.rubricField]=el.value;save()});document.querySelectorAll('[data-level-count]').forEach(el=>el.onclick=()=>{state.levelCount=Number(el.dataset.levelCount);save();render()});document.querySelectorAll('[data-level-name]').forEach(el=>el.onchange=()=>{state.levels[Number(el.dataset.levelName)].name=el.value;save()});document.querySelectorAll('[data-level-description]').forEach(el=>el.onchange=()=>{state.levels[Number(el.dataset.levelDescription)].description=el.value;save()});document.querySelectorAll('[data-revoke-role-manager]').forEach(el=>el.onclick=()=>revokeRoleManager(el.dataset.revokeRoleManager));const byId=id=>document.getElementById(id);if(byId('rubric-selector'))byId('rubric-selector').onchange=e=>{activeRubricIndex=Number(e.target.value);render()};if(byId('add-rubric'))byId('add-rubric').onclick=addRubric;if(byId('new-competency'))byId('new-competency').onclick=openDrawer;if(byId('add-category'))byId('add-category').onclick=()=>editCategory();if(byId('save-competency'))byId('save-competency').onclick=()=>{competency(activeCompetencyId).status='Draft';log('Saved competency',competency(activeCompetencyId).name);toast('Competency saved.');render()};if(byId('activate-competency'))byId('activate-competency').onclick=()=>{const c=competency(activeCompetencyId);if(!(c.rubrics||[]).length){toast('Add a role-level rubric before activation.','error');return}c.status='Active';log('Activated competency',c.name);toast('Competency activated.');render()};if(byId('save-level-model'))byId('save-level-model').onclick=()=>{log('Saved Rating Scale',`${state.levelCount} scores`);toast('Rating Scale saved.')};if(byId('save-template'))byId('save-template').onclick=()=>{framework(activeFrameworkId).status='Draft';log('Saved Framework Template',framework(activeFrameworkId).name);toast('Template saved.');render()};if(byId('publish-template'))byId('publish-template').onclick=publishTemplate;if(byId('analytics-team'))byId('analytics-team').onchange=e=>{currentTeamId=e.target.value;currentMemberId='';render()};if(byId('assign-role-manager'))byId('assign-role-manager').onclick=assignRoleManager;if(byId('import-employees'))byId('import-employees').onclick=importEmployees;if(byId('audit-search'))byId('audit-search').oninput=e=>byId('audit-entries').innerHTML=auditRows(e.target.value);if(byId('export-audit'))byId('export-audit').onclick=exportAudit}
    function editCategory(id){const item=category(id),assignments=activeRoleManagers(),selected=new Set(item?.assignmentIds||[]);openDialog({title:item?'Edit Category':'Add Category',body:`<div class="field"><label>Name</label><input id="category-name" value="${esc(item?.name||'')}"></div><div class="card" style="margin-top:12px">${assignments.map(a=>{const p=employee(a.employeeId);return `<label class="check-row"><input type="checkbox" data-category-assignment value="${a.id}" ${selected.has(a.id)?'checked':''}><span><b>${esc(p?.name)}</b><span class="row-meta"> · ${esc(a.managedRole)} · ${esc(a.team)}</span></span></label>`}).join('')}</div>`,confirm:'Save',onConfirm:()=>{const name=document.getElementById('category-name').value.trim(),assignmentIds=[...document.querySelectorAll('[data-category-assignment]:checked')].map(el=>el.value);if(!name||!assignmentIds.length){toast('Enter a name and select a Manager.','error');return}if(item)Object.assign(item,{name,assignmentIds});else state.categories.push({id:uid('cat'),name,assignmentIds});log(item?'Updated Category':'Created Category',name);closeDialog();toast('Category saved.');render()}})}
    function toggleFrameworkPick(el){const [fwId,catId,compId]=el.dataset.frameworkPick.split('|'),fc=framework(fwId).categories.find(c=>c.categoryId===catId),set=new Set(fc.competencyIds);el.checked?set.add(compId):set.delete(compId);fc.competencyIds=[...set];save();render()}
    function publishTemplate(){const f=framework(activeFrameworkId),affected=state.employees.filter(p=>p.role===f.role&&(p.team===f.team||f.team==='Company')),levels=[...new Set(affected.map(p=>p.level||'Unknown'))];openDialog({title:'Public this template?',body:`<div class="summary-list"><span>Template</span><b>${esc(f.name)}</b></div><div class="summary-list"><span>Competencies</span><b>${f.categories.reduce((n,c)=>n+c.competencyIds.length,0)}</b></div><div class="summary-list"><span>Affected employees</span><b>${affected.length}</b></div><div class="summary-list"><span>Role levels in scope</span><b>${esc(levels.join(', ')||'None')}</b></div>${affected.length?`<div class="validation info" style="margin-top:12px">${affected.map(p=>`${esc(p.name)} · ${esc(p.role)} · ${esc(p.level)}`).join('<br>')}</div>`:'<div class="validation" style="margin-top:12px">No imported Employee matches this template role and team.</div>'}`,confirm:'Public',onConfirm:()=>{f.status='Public';log('Public Framework Template',f.name);closeDialog();toast('Template is public.');render()}})}
    function addRubric(){const c=competency(activeCompetencyId);c.rubrics=c.rubrics||[];c.rubrics.push({role:'New role',level:'L1',criteria:'Evaluation criterion',below:'Describe behavior below expectation.',meet:'Describe behavior that meets expectation.',above:'Describe behavior above expectation.'});activeRubricIndex=c.rubrics.length-1;save();render()}
    function viewEvidence(reportId){const report=state.reports.find(r=>r.id===reportId),items=report?.evidence||[];openDialog({title:'Evidence · View only',body:items.length?items.map(item=>`<div class="card" style="margin-bottom:10px"><div class="section-head"><div><b>${esc(item.employee)}</b><div class="row-meta">${esc(item.competency)}</div></div><span class="badge info">Manager ${format(item.managerScore)}</span></div><div class="summary-list"><span>Employee reference</span><b>${format(item.employeeScore)}</b></div><div class="summary-list"><span>Context</span><span>${esc(item.context)}</span></div><div class="summary-list"><span>Manager rationale</span><span>${esc(item.rationale)}</span></div></div>`).join(''):'<div class="empty">No evidence attached.</div>'})}
    function importEmployees(){openDialog({title:'Import employees',body:`<div class="field"><label>Import data</label><textarea id="employee-import-data" rows="7">Employee 422,Quality Engineer,L2,Quality Team\nEmployee 517,Business Analyst,L1,Discovery Team</textarea></div><div class="validation info" style="margin-top:12px">Format: Employee, Role, Level, Team</div>`,confirm:'Import',onConfirm:()=>{const rows=document.getElementById('employee-import-data').value.split('\n').map(row=>row.split(',').map(value=>value.trim())).filter(row=>row.length===4&&row.every(Boolean));if(!rows.length){toast('Add at least one valid Employee row.','error');return}rows.forEach(([name,role,level,team])=>state.employees.push({id:uid('emp'),name,role,level,team,status:'Active',source:'HR import'}));log('Imported Employees',`${rows.length} records`);closeDialog();toast(`${rows.length} employees imported.`);render()}})}
    function assignRoleManager(){openDialog({title:'Assign Manager',body:`<div class="field"><label>Employee</label><select id="rm-employee">${state.employees.map(e=>`<option value="${e.id}">${esc(e.name)} · ${esc(e.role)} · ${esc(e.team)}</option>`).join('')}</select></div>`,confirm:'Assign',onConfirm:()=>{const person=employee(document.getElementById('rm-employee').value);if(activeRoleManagers().some(a=>a.employeeId===person.id&&a.managedRole===person.role&&a.team===person.team)){toast('This assignment already exists.','error');return}state.roleManagers.push({id:uid('rm'),employeeId:person.id,managedRole:person.role,team:person.team,status:'Active',effective:todayStamp(),assignedBy:'HR Admin'});log('Assigned Role Manager',person.name);closeDialog();toast('Manager assigned.');render()}})}
    function revokeRoleManager(id){const a=state.roleManagers.find(x=>x.id===id);a.status='Revoked';log('Revoked Role Manager',employee(a.employeeId)?.name);toast('Assignment revoked.');render()}
    function exportAudit(){const content=['Time,Actor,Action,Object',...state.audit.map(e=>[e.time,e.actor,e.action,e.object].map(v=>`"${String(v).replaceAll('"','""')}"`).join(','))].join('\n'),blob=new Blob([content],{type:'text/csv'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='enpath-audit-log.csv';a.click();URL.revokeObjectURL(url)}
    document.addEventListener('click',event=>{const nav=event.target.closest('[data-nav]');if(nav)navigate(nav.dataset.nav);if(event.target.closest('[data-close-dialog]'))closeDialog();if(event.target.closest('[data-close-drawer]'))closeDrawer()});document.getElementById('dialog-backdrop').onclick=e=>{if(e.target.id==='dialog-backdrop')closeDialog()};document.getElementById('drawer-backdrop').onclick=e=>{if(e.target.id==='drawer-backdrop')closeDrawer()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();closeDrawer()}});window.addEventListener('hashchange',()=>{route=(location.hash||'#overview').slice(1);render()});document.getElementById('reset-demo').onclick=()=>{localStorage.removeItem(STORAGE_KEY);state=deepCopy(initialState);competencyTab='pool';toast('Demo data reset.');navigate('overview')};render();
