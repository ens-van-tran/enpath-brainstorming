<svg xmlns="http://www.w3.org/2000/svg" width="3960" height="4300" viewBox="0 0 3960 4300">
  <rect x="0" y="0" width="3960" height="4300" fill="#F8F5FF"/>

  <g font-family="Inter, Arial, sans-serif" fill="#202331">
    <text x="120" y="132" font-size="82" font-weight="800">EN-PATH PERSONAS</text>
    <text x="120" y="206" font-size="34" fill="#666A78">Two primary roles shaping competency growth, evidence, and career mobility</text>
    <rect x="120" y="246" width="3720" height="6" rx="3" fill="#7763C5"/>

    <!-- Employee persona -->
    <g>
      <rect x="120" y="330" width="1810" height="2780" rx="34" fill="#FFFFFF" stroke="#B7CFF4" stroke-width="5"/>
      <rect x="120" y="330" width="1810" height="300" rx="34" fill="#DCEBFF"/>
      <rect x="120" y="596" width="1810" height="34" fill="#DCEBFF"/>
      <circle cx="260" cy="478" r="86" fill="#3370CC"/>
      <text x="260" y="502" text-anchor="middle" font-size="66" font-weight="800" fill="#FFFFFF">DN</text>
      <text x="390" y="430" font-size="48" font-weight="800" fill="#173D74">MR. DINH VAN NHAN</text>
      <text x="390" y="492" font-size="32" font-weight="700" fill="#3370CC">EMPLOYEE PERSONA</text>
      <text x="390" y="548" font-size="31" fill="#343A48">Backend Engineer  |  Male  |  Age 20-25</text>
      <text x="390" y="592" font-size="28" fill="#5D6574">Early-career engineer building practical technical skills</text>

      <rect x="170" y="670" width="1710" height="430" rx="25" fill="#F5F9FF" stroke="#C8DBF7" stroke-width="3"/>
      <text x="220" y="730" font-size="33" font-weight="800" fill="#3370CC">CHARACTERISTICS</text>
      <text x="220" y="784" font-size="29">
        <tspan x="220" dy="0">- Focuses on building technical skills early in his career</tspan>
        <tspan x="220" dy="53">- Wants a clear career path and growth path</tspan>
        <tspan x="220" dy="53">- Values continuous feedback and real-project recognition</tspan>
        <tspan x="220" dy="53">- Wants visibility into future-role and promotion requirements</tspan>
        <tspan x="220" dy="53">- Proactively seeks learning and practical guidance</tspan>
      </text>

      <rect x="170" y="1130" width="1710" height="530" rx="25" fill="#F5F9FF" stroke="#C8DBF7" stroke-width="3"/>
      <text x="220" y="1190" font-size="33" font-weight="800" fill="#3370CC">GOALS</text>
      <text x="220" y="1246" font-size="29">
        <tspan x="220" dy="0" font-weight="700">Understand current profile</tspan>
        <tspan x="220" dy="40">Skills, experience, strengths, and development areas</tspan>
        <tspan x="220" dy="52" font-weight="700">Identify skill gaps</tspan>
        <tspan x="220" dy="40">Compare current skills with a target role or level</tspan>
        <tspan x="220" dy="52" font-weight="700">Explore internal mobility</tspan>
        <tspan x="220" dy="40">Understand promotion or role-change readiness</tspan>
        <tspan x="220" dy="52" font-weight="700">Track growth and plan a path</tspan>
        <tspan x="220" dy="40">Keep skills current through work and build a practical roadmap</tspan>
      </text>

      <rect x="170" y="1690" width="1710" height="600" rx="25" fill="#FFFBEA" stroke="#E9D797" stroke-width="3"/>
      <text x="220" y="1750" font-size="33" font-weight="800" fill="#8C6B08">NEEDS AND EXPECTATIONS</text>
      <text x="220" y="1806" font-size="29">
        <tspan x="220" dy="0" font-weight="700">Continuous skill updates</tspan>
        <tspan x="220" dy="40">Request updates based on project contributions</tspan>
        <tspan x="220" dy="52" font-weight="700">Manager recognition</tspan>
        <tspan x="220" dy="40">Receive clear validation from the line manager</tspan>
        <tspan x="220" dy="52" font-weight="700">Transparent gaps</tspan>
        <tspan x="220" dy="40">See current skills against target-role requirements</tspan>
        <tspan x="220" dy="52" font-weight="700">Personalized growth path</tspan>
        <tspan x="220" dy="40">Practical learning recommendations and visible next roles</tspan>
      </text>

      <rect x="170" y="2320" width="1710" height="730" rx="25" fill="#FFF0F1" stroke="#E39AA2" stroke-width="3"/>
      <text x="220" y="2380" font-size="33" font-weight="800" fill="#B23B49">PAIN POINTS</text>
      <text x="220" y="2440" font-size="29">
        <tspan x="220" dy="0">- Skill updates depend on periodic performance reviews</tspan>
        <tspan x="220" dy="72">- Current skill levels and development priorities are unclear</tspan>
        <tspan x="220" dy="72">- Promotion or internal-move readiness is hard to judge</tspan>
        <tspan x="220" dy="72">- Completed-project contributions may go unrecognized</tspan>
        <tspan x="220" dy="72">- Next-role and next-level requirements lack visibility</tspan>
      </text>
      <rect x="220" y="2845" width="1610" height="145" rx="20" fill="#FFFFFF" stroke="#E4B4BA" stroke-width="2"/>
      <text x="260" y="2900" font-size="26" font-weight="700" fill="#B23B49">CORE TENSION</text>
      <text x="260" y="2944" font-size="28">Growth happens continuously, but recognition happens periodically.</text>
    </g>

    <!-- Manager persona -->
    <g>
      <rect x="2030" y="330" width="1810" height="2780" rx="34" fill="#FFFFFF" stroke="#F0BE91" stroke-width="5"/>
      <rect x="2030" y="330" width="1810" height="300" rx="34" fill="#FFE8D3"/>
      <rect x="2030" y="596" width="1810" height="34" fill="#FFE8D3"/>
      <circle cx="2170" cy="478" r="86" fill="#C86B27"/>
      <text x="2170" y="502" text-anchor="middle" font-size="66" font-weight="800" fill="#FFFFFF">LN</text>
      <text x="2300" y="430" font-size="48" font-weight="800" fill="#73350C">MR. LONG NGUYEN</text>
      <text x="2300" y="492" font-size="32" font-weight="700" fill="#C86B27">MANAGER PERSONA</text>
      <text x="2300" y="548" font-size="31" fill="#343A48">Engineering Manager  |  Male  |  Age 25-35</text>
      <text x="2300" y="592" font-size="28" fill="#5D6574">Coach, competency guide, and people-development owner</text>

      <rect x="2080" y="670" width="1710" height="430" rx="25" fill="#FFF8F2" stroke="#F1CEAD" stroke-width="3"/>
      <text x="2130" y="730" font-size="33" font-weight="800" fill="#C86B27">CHARACTERISTICS</text>
      <text x="2130" y="784" font-size="29">
        <tspan x="2130" dy="0">- Coaches through projects, feedback, and 1:1 conversations</tspan>
        <tspan x="2130" dy="53">- Values continuous, evidence-based development</tspan>
        <tspan x="2130" dy="53">- Knows engineering competencies by role and level</tspan>
        <tspan x="2130" dy="53">- Guides team career paths and growth paths</tspan>
        <tspan x="2130" dy="53">- Balances people development with project delivery</tspan>
      </text>

      <rect x="2080" y="1130" width="1710" height="530" rx="25" fill="#FFF8F2" stroke="#F1CEAD" stroke-width="3"/>
      <text x="2130" y="1190" font-size="33" font-weight="800" fill="#C86B27">GOALS</text>
      <text x="2130" y="1246" font-size="29">
        <tspan x="2130" dy="0">- Track each member's skills and progress</tspan>
        <tspan x="2130" dy="58">- Create and follow up development plans</tspan>
        <tspan x="2130" dy="58">- Prepare employees for target roles and internal mobility</tspan>
        <tspan x="2130" dy="58">- Capture feedback and contributions continuously</tspan>
        <tspan x="2130" dy="58">- Prepare evidence-backed performance reviews</tspan>
        <tspan x="2130" dy="58">- Identify common gaps and build team capability</tspan>
      </text>

      <rect x="2080" y="1690" width="1710" height="600" rx="25" fill="#FFFBEA" stroke="#E9D797" stroke-width="3"/>
      <text x="2130" y="1750" font-size="33" font-weight="800" fill="#8C6B08">NEEDS AND EXPECTATIONS</text>
      <text x="2130" y="1806" font-size="29">
        <tspan x="2130" dy="0">- Central skill, evidence, feedback, and development history</tspan>
        <tspan x="2130" dy="58">- Employee-requested reviews after projects or new skills</tspan>
        <tspan x="2130" dy="58">- Manager review and approval of submitted updates</tspan>
        <tspan x="2130" dy="58">- Historical evidence for performance reviews</tspan>
        <tspan x="2130" dy="58">- Trackable action plans after 1:1 conversations</tspan>
        <tspan x="2130" dy="58">- Target-role skill-gap analysis</tspan>
        <tspan x="2130" dy="58">- Practical promotion and mobility recommendations</tspan>
      </text>

      <rect x="2080" y="2320" width="1710" height="730" rx="25" fill="#FFF0F1" stroke="#E39AA2" stroke-width="3"/>
      <text x="2130" y="2380" font-size="33" font-weight="800" fill="#B23B49">PAIN POINTS</text>
      <text x="2130" y="2440" font-size="29">
        <tspan x="2130" dy="0">- No centralized competency-development platform</tspan>
        <tspan x="2130" dy="64">- Evidence gathering is manual and time-consuming</tspan>
        <tspan x="2130" dy="64">- Skill updates and review history are scattered</tspan>
        <tspan x="2130" dy="64">- Internal-mobility planning is difficult</tspan>
        <tspan x="2130" dy="64">- Six- or twelve-month reviews miss continuous progress</tspan>
        <tspan x="2130" dy="64">- 1:1 action plans are hard to track and often forgotten</tspan>
        <tspan x="2130" dy="64">- Employees lack a structured review-request path</tspan>
      </text>
    </g>

    <!-- Relationship and shared context -->
    <g>
      <line x1="1025" y1="3110" x2="1025" y2="3235" stroke="#3370CC" stroke-width="7"/>
      <path d="M1007 3210 L1025 3242 L1043 3210" fill="none" stroke="#3370CC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="2935" y1="3110" x2="2935" y2="3235" stroke="#C86B27" stroke-width="7"/>
      <path d="M2917 3210 L2935 3242 L2953 3210" fill="none" stroke="#C86B27" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="120" y="3250" width="3720" height="410" rx="34" fill="#FFFFFF" stroke="#7763C5" stroke-width="5"/>
      <text x="180" y="3322" font-size="35" font-weight="800" fill="#5B45A7">SHARED CONTEXT AND COLLABORATION</text>
      <rect x="180" y="3360" width="1700" height="230" rx="22" fill="#EEF5FF"/>
      <text x="230" y="3415" font-size="28" font-weight="800" fill="#3370CC">EMPLOYEE TO MANAGER</text>
      <text x="230" y="3464" font-size="30">
        <tspan x="230" dy="0">Requests competency review</tspan>
        <tspan x="230" dy="47">Supplies project evidence and rationale</tspan>
        <tspan x="230" dy="47">Shares progress against agreed next actions</tspan>
      </text>
      <rect x="2080" y="3360" width="1700" height="230" rx="22" fill="#FFF4EA"/>
      <text x="2130" y="3415" font-size="28" font-weight="800" fill="#C86B27">MANAGER TO EMPLOYEE</text>
      <text x="2130" y="3464" font-size="30">
        <tspan x="2130" dy="0">Coaches and clarifies target-role gaps</tspan>
        <tspan x="2130" dy="47">Reviews evidence and confirms action status</tspan>
        <tspan x="2130" dy="47">Updates the shared development roadmap</tspan>
      </text>
      <text x="1980" y="3630" text-anchor="middle" font-size="27" font-weight="700" fill="#5B45A7">Career profile  |  Target metrics  |  Gap analysis  |  Roadmap  |  Evidence  |  Decision history</text>
    </g>

    <!-- Governance nuances -->
    <g>
      <rect x="120" y="3700" width="2380" height="300" rx="30" fill="#F1EDFF" stroke="#A99ADF" stroke-width="4"/>
      <text x="180" y="3770" font-size="34" font-weight="800" fill="#5B45A7">REVIEWER NUANCE</text>
      <text x="180" y="3830" font-size="30">
        <tspan x="180" dy="0">The persona expects manager validation, but the journey rule is stricter:</tspan>
        <tspan x="180" dy="50" font-weight="700">competencies are verified by an authorized reviewer using evidence and rationale.</tspan>
        <tspan x="180" dy="50">Do not imply that every manager is automatically authorized.</tspan>
      </text>

      <rect x="2540" y="3700" width="1300" height="300" rx="30" fill="#FFF4DF" stroke="#D99D38" stroke-width="4"/>
      <text x="2600" y="3770" font-size="34" font-weight="800" fill="#9A5A00">HR ADMIN WARNING</text>
      <text x="2600" y="3830" font-size="29">
        <tspan x="2600" dy="0">No validated HR Admin persona exists.</tspan>
        <tspan x="2600" dy="49">Keep the HR journey marked Draft and</tspan>
        <tspan x="2600" dy="49">limited to competency-metrics duties.</tspan>
      </text>

      <rect x="120" y="4040" width="3720" height="150" rx="26" fill="#28223C"/>
      <text x="1980" y="4100" text-anchor="middle" font-size="27" font-weight="700" fill="#DCD4FF">CORE PRODUCT PROMISE</text>
      <text x="1980" y="4152" text-anchor="middle" font-size="34" font-weight="700" fill="#FFFFFF">Turn continuous project work into visible competency growth, shared follow-up, and reusable career evidence.</text>
    </g>
  </g>
</svg>
